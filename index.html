<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tower Escape</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;background:#162b55;
 touch-action:none;
 -webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;
 -webkit-text-size-adjust:100%;
}
body{position:fixed;inset:0}
canvas{
 position:fixed;inset:0;display:block;width:100vw;height:100vh;
 margin:0;padding:0;touch-action:none;
 -webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;
}
#hud{
 position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
 display:flex;justify-content:space-between;pointer-events:none;z-index:5;
 color:white;font:800 12px system-ui;letter-spacing:.5px
}
.badge{padding:8px 12px;border-radius:14px;background:#07142acc;border:1px solid #ffffff22;box-shadow:0 4px 16px #0005}
#dragHint{
 position:fixed;left:50%;top:max(70px,calc(70px + env(safe-area-inset-top)));
 transform:translateX(-50%);z-index:5;pointer-events:none;
 color:#ffffffb8;font:800 11px system-ui;letter-spacing:.7px;
 background:#07142a99;border:1px solid #ffffff18;border-radius:12px;padding:7px 10px;
}
#controls{
 position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));
 display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;z-index:6;pointer-events:none
}
button{
 border:1px solid #ffffff2d;background:#0a1425e8;color:#fff;font:900 25px system-ui;
 box-shadow:0 7px 18px #0007;touch-action:none;-webkit-tap-highlight-color:transparent;
 pointer-events:auto
}
button:active{transform:scale(.94);background:#21365b}
#jump{width:84px;height:84px;border-radius:50%;font-size:12px;letter-spacing:.5px}
#joystick{width:118px;height:118px;border-radius:50%;position:relative;touch-action:none;
 background:#07142ab8;border:2px solid #ffffff30;box-shadow:0 8px 24px #0008;pointer-events:auto
}
#stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;
 background:#243c68e8;border:2px solid #ffffff55;box-shadow:0 5px 14px #0008;
 transform:translate(0,0);pointer-events:none}
#joystick.active{background:#0b1b36e8}
#joystick.active #stick{background:#31518be8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="badge">ALTURA <span id="height">0</span></div><div class="badge">RÉCORD <span id="best">0</span></div></div>
<div id="controls"><div id="joystick" aria-label="Joystick"><div id="stick"></div></div><button id="jump">JUMP</button></div>
<div id="dragHint">ARRASTRA LA PIEZA PARA COLOCARLA</div>

<script>
"use strict";
const c=document.getElementById("game"),x=c.getContext("2d");
const DESIGN_W=1024,DESIGN_H=1536;
const BX=232,BY=160,BW=560,BH=1320,COLS=10,ROWS=24,CELL=56;
let scale=1,ox=0,oy=0;
let board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
let active=null,spawn=0.35,last=performance.now(),left=false,right=false;
let piecePointer=null,pieceDrag=null,pieceDragStart=null;
let state="play",best=+localStorage.getItem("tebest")||0,deathTimer=0;
const player={x:4.5,y:22.1,w:.5,h:.8,vx:0,vy:0,ground:false};
const pieces=[
 {m:[[1,1,1,1]],a:"#50d9ff",b:"#167aa4"},
 {m:[[1,1],[1,1]],a:"#ffd85a",b:"#b27619"},
 {m:[[0,1,0],[1,1,1]],a:"#b681ff",b:"#59349a"},
 {m:[[1,0,0],[1,1,1]],a:"#ff855d",b:"#9b3f2a"},
 {m:[[0,0,1],[1,1,1]],a:"#64df91",b:"#28784b"},
 {m:[[1,1,0],[0,1,1]],a:"#ff6876",b:"#9d3044"}
];

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const w=window.innerWidth,h=window.innerHeight;
 c.width=Math.max(1,Math.floor(w*dpr));
 c.height=Math.max(1,Math.floor(h*dpr));
 c.style.width=w+"px";
 c.style.height=h+"px";
 const sx=w/DESIGN_W,sy=h/DESIGN_H;
 scale=Math.max(sx,sy);
 ox=(w-DESIGN_W*scale)/2;
 oy=(h-DESIGN_H*scale)/2;
 x.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

function rr(cx,cy,w,h,r,fill,stroke){
 x.beginPath();x.roundRect(cx,cy,w,h,r);
 if(fill){x.fillStyle=fill;x.fill()}
 if(stroke){x.strokeStyle=stroke;x.stroke()}
}
function poly(points,fill,stroke){
 x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
 x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}
}
function spawnPiece(){
 const q=pieces[(Math.random()*pieces.length)|0];
 const m=q.m.map(r=>r.slice());
 active={m,x:Math.floor(Math.random()*(COLS-m[0].length+1)),y:-m.length,fall:2.4+Math.min(2.8,(22-player.y)*.02),a:q.a,b:q.b};
}
function rotate(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function hit(p,dx,dy,m){
 for(let yy=0;yy<m.length;yy++)for(let xx=0;xx<m[yy].length;xx++)if(m[yy][xx]){
  const X=Math.floor(p.x+xx+dx),Y=Math.floor(p.y+yy+dy);
  if(X<0||X>=COLS||Y>=ROWS)return true;
  if(Y>=0&&board[Y][X])return true;
 }
 return false;
}
function lock(){
 for(let yy=0;yy<active.m.length;yy++)for(let xx=0;xx<active.m[yy].length;xx++)if(active.m[yy][xx]){
  const Y=Math.floor(active.y+yy),X=Math.floor(active.x+xx);
  if(Y>=0&&Y<ROWS)board[Y][X]={a:active.a,b:active.b};
 }
 active=null;spawn=.18;
}
function solid(X,Y){
 if(X<0||X>=COLS||Y>=ROWS)return true;
 return Y>=0&&!!board[Y][X];
}
function playerHit(nx,ny){
 const l=Math.floor(nx-player.w/2+.03),r=Math.floor(nx+player.w/2-.03);
 const t=Math.floor(ny-player.h+.03),b=Math.floor(ny-.03);
 for(let yy=t;yy<=b;yy++)for(let xx=l;xx<=r;xx++)if(solid(xx,yy))return true;
 return false;
}
function jump(){if(state==="play"&&player.ground){player.vy=-7.7;player.ground=false}}
function activeFallsOntoPlayer(p,prevY){
 if(!p)return false;
 const pl=player.x-player.w/2, pr=player.x+player.w/2;
 const pt=player.y-player.h;
 for(let yy=0;yy<p.m.length;yy++)for(let xx=0;xx<p.m[yy].length;xx++)if(p.m[yy][xx]){
  const l=p.x+xx, r=l+1;
  const prevBottom=prevY+yy+1;
  const currBottom=p.y+yy+1;
  if(r>pl&&l<pr&&prevBottom<=pt&&currBottom>=pt)return true;
 }
 return false;
}
function move(dx){if(state==="play"){let n=Math.max(.28,Math.min(COLS-.28,player.x+dx));if(!playerHit(n,player.y))player.x=n}}
function end(win){
 state=win?"win":"lose";
 const h=Math.max(0,Math.floor((ROWS-player.y)*10));
 if(h>best){best=h;localStorage.setItem("tebest",best)}
}
function canvasPoint(clientX,clientY){
 return {x:(clientX-ox)/scale,y:(clientY-oy)/scale};
}
function insideBoardPoint(pt){
 return pt.x>=BX && pt.x<=BX+BW && pt.y>=BY && pt.y<=BY+BH;
}
function startPieceDrag(e){
 if(!active||state!=="play"||piecePointer!==null)return false;
 const pt=canvasPoint(e.clientX,e.clientY);
 if(!insideBoardPoint(pt))return false;
 const gx=(pt.x-BX)/CELL-active.x;
 const gy=(pt.y-BY)/CELL-active.y;
 const cellX=Math.floor(gx);
 const cellY=Math.floor(gy);

 // Cada celda ocupada de la pieza tiene su propia hitbox.
 // Los huecos de la matriz no forman parte de la pieza.
 if(cellX<0||cellY<0||cellY>=active.m.length||cellX>=active.m[cellY].length)return false;
 if(!active.m[cellY][cellX])return false;

 piecePointer=e.pointerId;
 pieceDrag={grabX:gx,grabY:gy};
 pieceDragStart={x:e.clientX,y:e.clientY};
 try{c.setPointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
 return true;
}
function updatePieceDrag(e){
 if(e.pointerId!==piecePointer||!active)return;
 const pt=canvasPoint(e.clientX,e.clientY);
 let nx=Math.round((pt.x-BX)/CELL-pieceDrag.grabX);
 let ny=Math.floor((pt.y-BY)/CELL-pieceDrag.grabY);
 nx=Math.max(0,Math.min(COLS-active.m[0].length,nx));
 ny=Math.max(-active.m.length,Math.min(ROWS-active.m.length,ny));
 // Mientras arrastramos, la pieza puede moverse libremente por la torre.
 // Nunca atraviesa bloques ya colocados.
 if(!hit(active,nx-active.x,ny-active.y,active.m)){
   active.x=nx;
   active.y=ny;
 }else if(!hit(active,nx-active.x,0,active.m)){
   active.x=nx;
 }
 e.preventDefault();
}
function rotateActivePiece(){
 if(!active||state!=="play")return;
 const rotated=rotate(active.m);
 // La rotación solo se acepta si la nueva forma cabe en la posición actual.
 if(!hit(active,0,0,rotated)){
   active.m=rotated;
   active.x=Math.max(0,Math.min(COLS-active.m[0].length,active.x));
 }
}
function endPieceDrag(e){
 if(e.pointerId!==piecePointer)return;
 const dx=e.clientX-(pieceDragStart?.x??e.clientX);
 const dy=e.clientY-(pieceDragStart?.y??e.clientY);
 const distance=Math.hypot(dx,dy);

 if(active&&state==="play"){
  if(distance<12){
   rotateActivePiece();
  }else{
   let guard=0;
   while(!hit(active,0,1,active.m)&&active.y<ROWS&&guard++<ROWS+2){
    const prevY=active.y;
    active.y++;
    if(activeFallsOntoPlayer(active,prevY)){
     state="lose";deathTimer=.75;active=null;break;
    }
   }
   if(active&&state==="play")lock();
  }
 }
 piecePointer=null;pieceDrag=null;pieceDragStart=null;
 try{c.releasePointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
}

function reset(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
 active=null;spawn=.3;state="play";deathTimer=0;player.x=4.5;player.y=22.1;player.vx=0;player.vy=0;player.ground=false;
}

function drawSky(){
 const g=x.createLinearGradient(0,0,0,DESIGN_H);
 g.addColorStop(0,"#224e94");g.addColorStop(.48,"#5c86c9");g.addColorStop(1,"#9eb1df");
 x.fillStyle=g;x.fillRect(0,0,DESIGN_W,DESIGN_H);

 // estrellas
 x.fillStyle="#fff9d9";
 for(let i=0;i<90;i++){
  const sx=(i*137)%DESIGN_W,sy=(i*73)%520,r=(i%3)*.45+.7;
  x.globalAlpha=.35+(i%4)*.12;x.beginPath();x.arc(sx,sy,r,0,7);x.fill()
 }
 x.globalAlpha=1;

 // nubes
 for(const q of [[70,360,1.1],[930,430,.95],[80,900,.75],[940,820,.85]]){
  const [cx,cy,s]=q;x.fillStyle="#dbe4fa88";
  x.beginPath();x.arc(cx-45*s,cy,38*s,0,7);x.arc(cx,cy-18*s,55*s,0,7);x.arc(cx+50*s,cy,42*s,0,7);x.fill()
 }
 // montañas y castillos
 poly([[0,1060],[120,850],[210,1020],[310,760],[430,1010],[520,820],[650,1030],[760,740],[880,1010],[1024,800],[1024,1536],[0,1536]],"#273f74");
 poly([[0,1180],[160,970],[270,1130],[400,930],[540,1160],[700,920],[860,1130],[1024,980],[1024,1536],[0,1536]],"#1b315f");
 x.fillStyle="#ffd96a";
 for(let i=0;i<24;i++){let sx=(i*97)%1000+12,sy=1060+(i*41)%330;x.fillRect(sx,sy,5,9)}
}

function drawTower(){
 // aura exterior
 x.fillStyle="#00000025";rr(BX-16,BY-8,BW+32,BH+40,20,"#07132170");

 // paredes laterales
 for(let side=0;side<2;side++){
  const wx=side?BX+BW:BX-58;
  const wg=x.createLinearGradient(wx,0,wx+(side?58:-58),0);
  wg.addColorStop(0,"#7082a0");wg.addColorStop(1,"#34425e");
  x.fillStyle=wg;x.fillRect(wx, BY-8,58,BH+38);

  for(let i=0;i<16;i++){
   const yy=BY+i*82;
   const off=(i%2)*13;
   rr(wx+(side?5:3)+off,yy,46,70,7,"#667a99","#26344e");
   // highlights
   x.strokeStyle="#a8b7cf55";x.lineWidth=3;
   x.beginPath();x.moveTo(wx+10+off,yy+9);x.lineTo(wx+38+off,yy+9);x.stroke();
   if(i%5===2){x.strokeStyle="#27344f";x.lineWidth=3;x.beginPath();x.moveTo(wx+14+off,yy+20);x.lineTo(wx+29+off,yy+48);x.stroke()}
  }
 }

 // base
 const bg=x.createLinearGradient(BX,0,BX,BY+80);
 bg.addColorStop(0,"#667895");bg.addColorStop(1,"#34435d");
 x.fillStyle=bg;x.fillRect(BX-64,BY+BH-2,BW+128,82);
 for(let i=0;i<12;i++)rr(BX-55+i*55,BY+BH+5,48,58,6,i%2?"#667792":"#52647e","#26344e");

 // top battlement
 x.fillStyle="#50617e";x.fillRect(BX-64,BY-66,BW+128,70);
 for(let i=0;i<12;i++){
  const gap=i%2?28:0;
  rr(BX-58+i*55,BY-83-gap,47,49,7,"#647895","#26344e");
 }

 // gate
 const gx=BX+BW/2;
 x.shadowColor="#ffc84a88";x.shadowBlur=32;
 x.fillStyle="#d9a943";x.beginPath();x.arc(gx,BY-42,63,Math.PI,0);x.lineTo(gx+63,BY-4);x.lineTo(gx-63,BY-4);x.closePath();x.fill();
 x.shadowBlur=0;
 x.fillStyle="#7c5a28";x.beginPath();x.arc(gx,BY-43,48,Math.PI,0);x.lineTo(gx+48,BY-4);x.lineTo(gx-48,BY-4);x.closePath();x.fill();
 x.fillStyle="#ffd766";x.fillRect(gx-5,BY-83,10,76);
 x.strokeStyle="#fff0a0";x.lineWidth=4;x.beginPath();x.arc(gx,BY-43,39,Math.PI,0);x.stroke();

 // interior
 const inner=x.createLinearGradient(0,BY,0,BY+BH);
 inner.addColorStop(0,"#0d1b31");inner.addColorStop(1,"#091221");
 x.fillStyle=inner;x.fillRect(BX,BY,BW,BH);

 // grid
 x.strokeStyle="#55719a20";x.lineWidth=1;
 for(let i=0;i<=COLS;i++){x.beginPath();x.moveTo(BX+i*CELL,BY);x.lineTo(BX+i*CELL,BY+BH);x.stroke()}
 for(let j=0;j<=ROWS;j++){x.beginPath();x.moveTo(BX,BY+j*CELL);x.lineTo(BX+BW,BY+j*CELL);x.stroke()}

 // inner edge
 x.strokeStyle="#b5c5df22";x.lineWidth=3;x.strokeRect(BX+2,BY+2,BW-4,BH-4);
}

function block(col,row,pal,ghost=false){
 const px=BX+col*CELL+3,py=BY+row*CELL+3;
 const g=x.createLinearGradient(px,py,px+CELL,py+CELL);
 g.addColorStop(0,pal.a);g.addColorStop(1,pal.b);
 x.globalAlpha=ghost?.72:1;
 rr(px,py,CELL-6,CELL-6,8,g);
 x.fillStyle="#fff";x.globalAlpha*=.16;rr(px+6,py+5,CELL-17,6,3,"#fff");
 x.globalAlpha=ghost?.72:1;x.fillStyle="#000";x.globalAlpha*=.18;rr(px+5,py+CELL-10,CELL-16,5,2,"#000");
 x.globalAlpha=1;
}

function drawPlayer(){
 const px=BX+(player.x+.5)*CELL,py=BY+player.y*CELL;
 x.save();x.translate(px,py);
 x.fillStyle="#00000066";x.beginPath();x.ellipse(0,5,13,5,0,0,7);x.fill();
 x.fillStyle="#283b71";rr(-11,-22,22,24,6,"#293d77");
 x.fillStyle="#f0b995";x.beginPath();x.arc(0,-34,11,0,7);x.fill();
 x.fillStyle="#222e48";x.beginPath();x.arc(0,-38,12,Math.PI,7);x.fill();
 x.fillStyle="#182238";x.beginPath();x.arc(4,-34,1.8,0,7);x.fill();
 x.fillStyle="#e65b72";rr(-9,0,8,15,4,"#e65b72");rr(1,0,8,15,4,"#e65b72");
 x.restore();
}

function draw(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 x.setTransform(dpr,0,0,dpr,0,0);
 x.clearRect(0,0,innerWidth,innerHeight);
 x.save();x.translate(ox,oy);x.scale(scale,scale);
 drawSky();drawTower();

 for(let y=0;y<ROWS;y++)for(let i=0;i<COLS;i++)if(board[y][i])block(i,y,board[y][i]);
 if(active)for(let y=0;y<active.m.length;y++)for(let i=0;i<active.m[y].length;i++)if(active.m[y][i])block(active.x+i,Math.floor(active.y+y),active);
 drawPlayer();

 // salida
 x.fillStyle="#ffd65a";x.globalAlpha=.75;x.fillRect(BX,BY+4,BW,4);x.globalAlpha=1;
 if(state==="lose"){
  x.fillStyle="#050914cc";x.fillRect(0,0,DESIGN_W,DESIGN_H);
  x.textAlign="center";x.textBaseline="middle";
  x.fillStyle="#ff6b6b";x.font="900 64px system-ui";x.fillText("¡MUERTO!",DESIGN_W/2,DESIGN_H/2-35);
  x.fillStyle="#fff";x.font="800 24px system-ui";x.fillText("La pieza te ha golpeado",DESIGN_W/2,DESIGN_H/2+35);
  x.fillStyle="#ffffff99";x.font="700 18px system-ui";x.fillText("Reiniciando…",DESIGN_W/2,DESIGN_H/2+75);
 }
 x.restore();
 document.getElementById("height").textContent=Math.max(0,Math.floor((ROWS-player.y)*10));
 document.getElementById("best").textContent=best;
}

function update(dt){
 if(state==="lose"){
  deathTimer-=dt;
  if(deathTimer<=0)reset();
  return;
 }
 if(state!=="play")return;
 if(spawn>0){spawn-=dt;if(spawn<=0)spawnPiece()}
 if(active){
  const prevY=active.y;
  active.y+=active.fall*dt;
  // Solo muere si la pieza cae desde arriba sobre el personaje.
  if(activeFallsOntoPlayer(active,prevY)){
   state="lose";
   deathTimer=.75;
   active=null;
   return;
  }
  if(hit(active,0,0,active.m)){active.y=Math.floor(active.y);if(hit(active,0,0,active.m))lock()}
  if(active&&active.y+active.m.length>=ROWS){while(hit(active,0,0,active.m)&&active.y>0)active.y-=.02;lock()}
 }
 const target=(left?-4.3:0)+(right?4.3:0);
 player.vx+=(target-player.vx)*Math.min(1,dt*14);
 let nx=Math.max(player.w/2,Math.min(COLS-player.w/2,player.x+player.vx*dt));
 if(!playerHit(nx,player.y))player.x=nx;else player.vx=0;
 player.vy+=18.5*dt;
 let ny=player.y+player.vy*dt;
 if(!playerHit(player.x,ny)){player.y=ny;player.ground=false}
 else{
  if(player.vy>0){let n=0;while(playerHit(player.x,ny)&&n++<20)ny-=.01;player.y=ny;player.ground=true}
  player.vy=0
 }
 if(player.y-player.h<=.3){state="win"}
}

function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// Joystick virtual: controla izquierda/derecha según la posición horizontal de la palanca.
const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");
let joyPointer=null;
function setJoystick(e){
 const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=30,dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 const dead=7;
 left=dx < -dead; right=dx > dead;
}
function resetJoystick(){
 joyPointer=null;left=false;right=false;stick.style.transform="translate(0,0)";joystick.classList.remove("active");
}
joystick.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();joyPointer=e.pointerId;joystick.classList.add("active");joystick.setPointerCapture?.(e.pointerId);setJoystick(e)});
joystick.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer){e.preventDefault();e.stopPropagation();setJoystick(e)}});
joystick.addEventListener("pointerup",e=>{if(e.pointerId===joyPointer){e.preventDefault();e.stopPropagation();resetJoystick()}});
joystick.addEventListener("pointercancel",e=>{if(e.pointerId===joyPointer)resetJoystick()});
joystick.addEventListener("lostpointercapture",()=>{if(joyPointer!==null)resetJoystick()});
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();jump()});
let sw=null;
c.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(piecePointer!==null)return;
 if(startPieceDrag(e))return;
 sw={x:e.clientX,y:e.clientY,pointerId:e.pointerId};
});
c.addEventListener("pointermove",e=>{
 if(piecePointer!==null)updatePieceDrag(e);
});
c.addEventListener("pointerup",e=>{
 if(piecePointer!==null){endPieceDrag(e);return}
 if(!sw||e.pointerId!==sw.pointerId)return;
 const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
 else jump();
 sw=null;
});
c.addEventListener("pointercancel",e=>{
 if(piecePointer!==null){piecePointer=null;pieceDrag=null;pieceDragStart=null}
 if(sw&&e.pointerId===sw.pointerId)sw=null;
});
