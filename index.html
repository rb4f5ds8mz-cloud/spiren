<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPIREN — RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:Arial,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:100vw;height:100vh;max-width:1500px;overflow:hidden;background:#050711}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;inset:0;pointer-events:none}.panel{position:absolute;top:18px;padding:10px;border:2px solid rgba(205,165,75,.9);background:linear-gradient(145deg,rgba(12,17,31,.94),rgba(25,22,29,.82));box-shadow:0 0 18px rgba(0,0,0,.65),inset 0 0 12px rgba(255,205,100,.08);border-radius:12px;backdrop-filter:blur(4px)}#heroPanel{left:18px;width:315px}#enemyPanel{right:18px;width:300px}.portrait{float:left;width:65px;height:65px;border-radius:50%;border:3px solid #cba34b;background:#101522;margin-right:10px}.enemyPortrait{float:right;margin-left:10px;margin-right:0;border-radius:10px}.title{font-weight:bold;font-size:15px;margin:4px 0 8px;color:#f6df9a}.statbar{height:10px;margin:5px 0;border:1px solid #111;background:#171717;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;transition:width .35s ease}.hp{background:linear-gradient(90deg,#8e1515,#f33)}.mp{background:linear-gradient(90deg,#164d9a,#3ca5ff)}.exp{background:linear-gradient(90deg,#18752d,#4ce26a)}.label{font-size:10px;color:#ddd}#sideMenu{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;pointer-events:auto}.sideBtn{width:66px;height:66px;border-radius:50%;border:3px solid #c89d42;background:radial-gradient(circle at 35% 30%,#45424b,#14151c 70%);color:#fff;box-shadow:0 5px 12px #000;cursor:pointer;font-size:25px;transition:.15s}.sideBtn span{display:block;font-size:8px;margin-top:2px;color:#f5d98d}.sideBtn:active{transform:scale(.9)}#combat{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 150px));display:flex;gap:10px;pointer-events:auto}.action{flex:1;min-height:72px;border-radius:12px;border:2px solid #b99446;color:white;font-weight:bold;font-size:14px;cursor:pointer;box-shadow:0 5px 12px #000;text-shadow:0 2px 3px #000;transition:.15s}.action:active{transform:translateY(3px) scale(.98)}.action:disabled{filter:grayscale(1);opacity:.45}.attack{background:linear-gradient(#a52b2b,#501515)}.skill{background:linear-gradient(#2865a7,#102b54)}.item{background:linear-gradient(#318c55,#164d2c)}.run{background:linear-gradient(#b28b2c,#59430e)}.icon{font-size:26px;display:block;margin-bottom:3px}#hotbar{position:absolute;right:20px;bottom:25px;display:flex;gap:5px;pointer-events:auto}.slot{width:52px;height:52px;border:2px solid #c69b3d;background:#12151e;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;font-size:24px}.count{position:absolute;bottom:2px;right:4px;font-size:11px;color:#fff}#message{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff;text-shadow:0 2px 5px #000;opacity:0;transition:.3s;pointer-events:none}#modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20}.modalBox{width:min(470px,90%);max-height:80%;overflow:auto;padding:25px;border:2px solid #c9a54e;border-radius:16px;background:linear-gradient(145deg,#171b29,#090b12);box-shadow:0 0 50px #000}.modalBox h2{margin-top:0;color:#f4d582}.modalRow{padding:12px;margin:8px 0;border:1px solid #67552d;border-radius:9px;background:#111521}.modalBtn{width:100%;padding:12px;margin-top:8px;border:1px solid #c7a54c;background:#29230f;color:#fff;border-radius:8px;cursor:pointer}.close{background:#591b1b}#gameOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.82);z-index:30}#gameOver h1{font-size:55px;color:#e33;text-shadow:0 0 20px #900}#restart{padding:15px 35px;background:#ad2222;color:white;border:2px solid #e5bb5c;border-radius:10px;font-size:18px}@media(max-width:700px){#heroPanel{left:6px;top:6px;width:220px;padding:6px}#enemyPanel{right:6px;top:6px;width:190px;padding:6px}.portrait{width:42px;height:42px}.enemyPortrait{width:42px;height:42px}.title{font-size:10px;margin:2px 0 4px}.statbar{height:7px;margin:3px 0}.label{font-size:8px}#sideMenu{left:5px;top:42%;gap:6px}.sideBtn{width:46px;height:46px;font-size:17px;border-width:2px}.sideBtn span{font-size:6px}#combat{bottom:7px;width:calc(100% - 65px);left:55%;gap:4px}.action{min-height:60px;font-size:9px;border-width:1px}.icon{font-size:20px}#hotbar{right:5px;bottom:78px}.slot{width:38px;height:38px;font-size:18px}#message{font-size:18px}}
</style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas><div id="hud">
<div class="panel" id="heroPanel"><canvas class="portrait" id="heroPortrait" width="80" height="80"></canvas><div class="title">NIV. <span id="level">1</span> - SPIREN</div><div class="label">HP <span id="hpText">120/120</span></div><div class="statbar"><div id="hpBar" class="fill hp"></div></div><div class="label">MP <span id="mpText">50/50</span></div><div class="statbar"><div id="mpBar" class="fill mp"></div></div><div class="label">EXP <span id="expText">0/100</span></div><div class="statbar"><div id="expBar" class="fill exp"></div></div></div>
<div class="panel" id="enemyPanel"><canvas class="portrait enemyPortrait" id="enemyPortrait" width="80" height="80"></canvas><div class="title">CARACOL VERDE - NIV. <span id="enemyLevel">1</span></div><div class="label">HP <span id="enemyHpText">45/60</span></div><div class="statbar"><div id="enemyHpBar" class="fill hp"></div></div></div>
<div id="sideMenu"><button class="sideBtn" onclick="openInventory()">🎒<span>INVENTARIO</span></button><button class="sideBtn" onclick="openMissions()">📜<span>MISIONES</span></button><button class="sideBtn" onclick="openStats()">⚔️<span>ESTADÍSTICAS</span></button><button class="sideBtn" onclick="openSettings()">⚙️<span>AJUSTES</span></button></div>
<div id="combat"><button id="attackBtn" class="action attack" onclick="playerAttack()"><span class="icon">⚔</span>ATACAR</button><button id="skillBtn" class="action skill" onclick="openSkills()"><span class="icon">✦</span>HABILIDAD</button><button id="itemBtn" class="action item" onclick="usePotion()"><span class="icon">🧪</span>OBJETO</button><button id="runBtn" class="action run" onclick="attemptRun()"><span class="icon">🏃</span>HUIR</button></div>
<div id="hotbar"><div class="slot">🧪<span class="count" id="potionCount">3</span></div><div class="slot">＋</div><div class="slot">＋</div></div><div id="message"></div></div>
<div id="modal"><div class="modalBox" id="modalContent"></div></div><div id="gameOver"><h1>GAME OVER</h1><button id="restart" onclick="restartGame()">REINICIAR</button></div></div>
<script>
"use strict";
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");let W,H,DPR,last=0;
const hero={level:1,hp:120,maxHp:120,mp:50,maxMp:50,exp:0,expNext:100,atk:18,def:8,speed:10,x:0,y:0,baseX:0,baseY:0,anim:"idle",animTime:0,attackTime:0,hitTime:0};
const enemy={level:1,hp:45,maxHp:60,atk:9,x:0,y:0,baseX:0,baseY:0,anim:"idle",animTime:0,hitTime:0,alive:true};
let turn="player",locked=false,potions=3,kills=0;
const petals=[];for(let i=0;i<65;i++)petals.push({x:Math.random(),y:Math.random(),s:.5+Math.random()*1.8,speed:.015+Math.random()*.035,drift:Math.random()*Math.PI*2});
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);hero.baseX=W*.39;hero.baseY=H*.60;enemy.baseX=W*.68;enemy.baseY=H*.60;if(!locked){hero.x=hero.baseX;hero.y=hero.baseY;enemy.x=enemy.baseX;enemy.y=enemy.baseY}}
addEventListener("resize",resize);resize();
function drawBackground(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#040719");g.addColorStop(.5,"#10183a");g.addColorStop(1,"#05070e");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const moonX=W*.73,moonY=H*.18,moonR=Math.min(W,H)*.11;const glow=ctx.createRadialGradient(moonX,moonY,moonR*.5,moonX,moonY,moonR*2.5);glow.addColorStop(0,"rgba(255,245,190,.25)");glow.addColorStop(1,"rgba(255,245,190,0)");ctx.fillStyle=glow;ctx.beginPath();ctx.arc(moonX,moonY,moonR*2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff4c7";ctx.beginPath();ctx.arc(moonX,moonY,moonR,0,Math.PI*2);ctx.fill();ctx.fillStyle="#0a1022";ctx.beginPath();ctx.moveTo(0,H*.42);ctx.lineTo(W*.12,H*.27);ctx.lineTo(W*.25,H*.40);ctx.lineTo(W*.42,H*.25);ctx.lineTo(W*.57,H*.39);ctx.lineTo(W*.74,H*.24);ctx.lineTo(W,H*.4);ctx.lineTo(W,H*.65);ctx.lineTo(0,H*.65);ctx.closePath();ctx.fill();ctx.fillStyle="#080c19";ctx.beginPath();ctx.moveTo(0,H*.5);ctx.lineTo(W*.2,H*.37);ctx.lineTo(W*.37,H*.5);ctx.lineTo(W*.57,H*.35);ctx.lineTo(W*.78,H*.5);ctx.lineTo(W,H*.39);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();drawRiver();drawBridge();drawTorii();drawPagoda();drawLantern(W*.16,H*.63);drawLantern(W*.83,H*.64);drawLantern(W*.56,H*.70);drawPetals(t)}
function drawRiver(){const y=H*.70;ctx.fillStyle="#0a3550";ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.25,y-30,W*.38,y+35,W*.55,y);ctx.bezierCurveTo(W*.72,y-35,W*.86,y+30,W,y-10);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(100,200,230,.4)";ctx.lineWidth=2;for(let i=0;i<8;i++){let yy=y+20+i*18;ctx.beginPath();ctx.moveTo((i*83)%W,yy);ctx.quadraticCurveTo((i*83)%W+80,yy-5,(i*83)%W+150,yy);ctx.stroke()}}
function drawBridge(){const x=W*.25,y=H*.58,bw=W*.43;ctx.save();ctx.fillStyle="#4a2918";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+bw,y);ctx.lineTo(x+bw-30,y+65);ctx.lineTo(x+30,y+65);ctx.closePath();ctx.fill();ctx.strokeStyle="#9b5d30";ctx.lineWidth=7;for(let i=0;i<9;i++){let xx=x+10+i*(bw-20)/8;ctx.beginPath();ctx.moveTo(xx,y+8);ctx.lineTo(xx+10,y+55);ctx.stroke()}ctx.lineWidth=5;ctx.strokeStyle="#c18043";ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+bw*.5,y+25,x+bw,y);ctx.stroke();ctx.restore()}
function drawTorii(){const x=W*.08,y=H*.49,s=Math.min(W,H)*.13;ctx.save();ctx.strokeStyle="#a52c25";ctx.lineWidth=Math.max(7,s*.08);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+s);ctx.moveTo(x+s*.65,y);ctx.lineTo(x+s*.65,y+s);ctx.stroke();ctx.lineWidth=Math.max(9,s*.1);ctx.beginPath();ctx.moveTo(x-s*.08,y);ctx.lineTo(x+s*.73,y);ctx.stroke();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+.04*s,y+.22*s);ctx.lineTo(x+.62*s,y+.22*s);ctx.stroke();ctx.restore()}
function drawPagoda(){const x=W*.86,y=H*.47,s=Math.min(W,H)*.12;ctx.save();ctx.fillStyle="#241b1a";ctx.strokeStyle="#74543a";for(let i=0;i<4;i++){const yy=y+i*s*.17,ww=s*(1-i*.17);ctx.beginPath();ctx.moveTo(x-ww/2,yy);ctx.lineTo(x+ww/2,yy);ctx.lineTo(x+ww*.4,yy+s*.08);ctx.lineTo(x-ww*.4,yy+s*.08);ctx.closePath();ctx.fill();ctx.stroke()}ctx.fillRect(x-s*.07,y+s*.08,s*.14,s*.55);ctx.restore()}
function drawLantern(x,y){ctx.save();ctx.shadowColor="#ffbd58";ctx.shadowBlur=20;ctx.fillStyle="#efae52";ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#27252a";ctx.fillRect(x-6,y+8,12,40);ctx.fillRect(x-12,y+42,24,7);ctx.fillRect(x-14,y+49,28,5);ctx.restore()}
function drawPetals(t){for(const p of petals){p.y+=p.speed/60;p.x+=Math.sin(t*.001+p.drift)*.00008;if(p.y>1.05){p.y=-.05;p.x=Math.random()}ctx.save();ctx.translate(p.x*W,p.y*H);ctx.rotate(t*.001+p.drift);ctx.fillStyle="rgba(255,170,195,.75)";ctx.beginPath();ctx.ellipse(0,0,4*p.s,2.5*p.s,0,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drawHero(t){let breathe=Math.sin(t*.003)*3,x=hero.x,y=hero.y+breathe;if(hero.hitTime>0)x+=(Math.random()-.5)*10;ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(0,40,48,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#171b27";ctx.fillRect(-22,15,15,34);ctx.fillRect(7,15,15,34);ctx.fillStyle="#0b0d13";ctx.fillRect(-27,43,22,8);ctx.fillRect(5,43,25,8);ctx.fillStyle="#171b25";ctx.beginPath();ctx.moveTo(-27,-12);ctx.lineTo(25,-12);ctx.lineTo(30,20);ctx.lineTo(-28,20);ctx.closePath();ctx.fill();ctx.strokeStyle="#a72b2b";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-20,-3);ctx.lineTo(20,10);ctx.stroke();ctx.fillStyle="#d79b72";ctx.beginPath();ctx.arc(0,-35,20,0,Math.PI*2);ctx.fill();ctx.fillStyle="#090b10";ctx.beginPath();ctx.moveTo(-21,-37);ctx.lineTo(-27,-54);ctx.lineTo(-14,-47);ctx.lineTo(-8,-60);ctx.lineTo(0,-49);ctx.lineTo(10,-60);ctx.lineTo(12,-47);ctx.lineTo(26,-53);ctx.lineTo(19,-33);ctx.closePath();ctx.fill();ctx.fillStyle="#11131b";ctx.fillRect(-20,-35,40,13);ctx.fillStyle="#f4e5ba";ctx.fillRect(-13,-30,7,3);ctx.fillRect(6,-30,7,3);const wave=Math.sin(t*.006)*12;ctx.strokeStyle="#a9272c";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(16,-17);ctx.quadraticCurveTo(48,0,58+wave,-17);ctx.quadraticCurveTo(74+wave,-32,88+wave,-10);ctx.stroke();ctx.strokeStyle="#202532";ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(20,-4);ctx.lineTo(37,12);ctx.stroke();ctx.strokeStyle="#ddd";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(34,8);ctx.lineTo(72,-35);ctx.stroke();ctx.strokeStyle="#b78b35";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(30,10);ctx.lineTo(43,21);ctx.stroke();if(hero.attackTime>0){const p=hero.attackTime;ctx.globalAlpha=Math.min(1,p*4);ctx.strokeStyle="rgba(255,255,255,.95)";ctx.lineWidth=7;ctx.beginPath();ctx.arc(40,-10,75,-1.1,1);ctx.stroke();ctx.strokeStyle="rgba(235,60,70,.7)";ctx.lineWidth=13;ctx.beginPath();ctx.arc(40,-10,68,-1.1,1);ctx.stroke()}ctx.restore()}
function drawEnemy(t){if(!enemy.alive)return;let x=enemy.x,y=enemy.y+Math.sin(t*.003)*2;if(enemy.hitTime>0){x+=(Math.random()-.5)*12;y+=(Math.random()-.5)*5}ctx.save();ctx.translate(x,y);if(enemy.hitTime>0&&Math.floor(enemy.hitTime*12)%2===0)ctx.globalAlpha=.45;ctx.fillStyle="rgba(0,0,0,.5)";ctx.beginPath();ctx.ellipse(0,45,55,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#5bbd39";ctx.beginPath();ctx.ellipse(5,20,48,27,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#704629";ctx.beginPath();ctx.arc(-18,-8,35,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#b87c43";ctx.lineWidth=4;ctx.beginPath();ctx.arc(-18,-8,23,.3,5.5);ctx.stroke();const a=Math.sin(t*.005)*5;ctx.strokeStyle="#63ca45";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(22,0);ctx.quadraticCurveTo(32,-40+a,38,-52+a);ctx.moveTo(39,3);ctx.quadraticCurveTo(50,-37-a,57,-46-a);ctx.stroke();ctx.fillStyle="#f6dc38";ctx.beginPath();ctx.arc(38,-53+a,6,0,Math.PI*2);ctx.arc(57,-47-a,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(39,-54+a,2,0,Math.PI*2);ctx.arc(58,-48-a,2,0,Math.PI*2);ctx.fill();ctx.fillStyle="#397d2a";ctx.beginPath();ctx.arc(45,13,15,0,Math.PI*2);ctx.fill();ctx.restore()}
const floating=[];function damageText(x,y,text,color="#ff4545"){floating.push({x,y,text,color,life:1,vy:-45})}function drawFloating(dt){for(let i=floating.length-1;i>=0;i--){const f=floating[i];f.life-=dt;f.y+=f.vy*dt;ctx.save();ctx.globalAlpha=Math.max(0,f.life);ctx.font="bold 25px Arial";ctx.textAlign="center";ctx.fillStyle=f.color;ctx.strokeStyle="#000";ctx.lineWidth=4;ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.restore();if(f.life<=0)floating.splice(i,1)}}function flashHit(x,y){ctx.save();ctx.globalAlpha=.75;const g=ctx.createRadialGradient(x,y,2,x,y,70);g.addColorStop(0,"#fff");g.addColorStop(.25,"#ffdd72");g.addColorStop(1,"rgba(255,60,60,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,70,0,Math.PI*2);ctx.fill();ctx.restore()}
function playerAttack(){if(locked||turn!=="player"||!enemy.alive)return;locked=true;turn="enemy";hero.anim="attack";hero.attackTime=1;const damage=hero.atk+Math.floor(Math.random()*7)-2;setTimeout(()=>{enemy.hp=Math.max(0,enemy.hp-damage);enemy.hitTime=.8;damageText(enemy.x,enemy.y-60,"-"+damage);flashHit(enemy.x,enemy.y-15);updateHUD();if(enemy.hp<=0){enemy.alive=false;kills++;hero.exp+=50;showMessage("+50 EXP");setTimeout(checkLevel,800)}else setTimeout(enemyAttack,900)},450)}
function enemyAttack(){if(hero.hp<=0)return;enemy.anim="attack";const start=enemy.x,target=hero.x;animateValue(0,1,450,v=>enemy.x=start+(target-start)*Math.sin(v*Math.PI),()=>{const damage=Math.max(1,enemy.atk+Math.floor(Math.random()*5)-hero.def);hero.hp=Math.max(0,hero.hp-damage);hero.hitTime=.7;damageText(hero.x,hero.y-65,"-"+damage);flashHit(hero.x,hero.y-15);enemy.x=enemy.baseX;updateHUD();if(hero.hp<=0)setTimeout(gameOver,500);else setTimeout(()=>{turn="player";locked=false},650)})}
function checkLevel(){if(hero.exp>=hero.expNext){hero.exp-=hero.expNext;hero.level++;hero.expNext=Math.floor(hero.expNext*1.35);hero.maxHp+=25;hero.maxMp+=10;hero.atk+=5;hero.def+=2;hero.speed++;hero.hp=hero.maxHp;hero.mp=hero.maxMp;showMessage("¡NIVEL "+hero.level+"!");setTimeout(newEnemy,1000)}else setTimeout(newEnemy,700);updateHUD()}
function newEnemy(){enemy.level=hero.level;enemy.maxHp=60+hero.level*12;enemy.hp=enemy.maxHp;enemy.atk=9+hero.level*3;enemy.x=enemy.baseX;enemy.y=enemy.baseY;enemy.alive=true;turn="player";locked=false;updateHUD()}
function usePotion(){if(locked||turn!=="player")return;if(potions<=0){showMessage("No tienes pociones");return}if(hero.hp>=hero.maxHp){showMessage("HP al máximo");return}potions--;const heal=35;hero.hp=Math.min(hero.maxHp,hero.hp+heal);damageText(hero.x,hero.y-60,"+"+heal,"#5cff75");updateHUD();locked=true;turn="enemy";setTimeout(enemyAttack,600)}
function openSkills(){if(locked||turn!=="player")return;openModal(`<h2>✦ HABILIDADES</h2><div class="modalRow"><b>⚔ Corte Veloz</b><br>Daño elevado. Coste: 15 MP<button class="modalBtn" onclick="quickSlash()">USAR</button></div><div class="modalRow"><b>💚 Curación</b><br>Recupera 35 HP. Coste: 20 MP<button class="modalBtn" onclick="healSkill()">USAR</button></div><button class="modalBtn close" onclick="closeModal()">CERRAR</button>`)}
function quickSlash(){closeModal();if(hero.mp<15){showMessage("MP insuficiente");return}hero.mp-=15;locked=true;turn="enemy";hero.attackTime=1;setTimeout(()=>{const damage=hero.atk*2+Math.floor(Math.random()*8);enemy.hp=Math.max(0,enemy.hp-damage);enemy.hitTime=.8;damageText(enemy.x,enemy.y-60,"-"+damage);flashHit(enemy.x,enemy.y);updateHUD();if(enemy.hp<=0){enemy.alive=false;hero.exp+=50;showMessage("+50 EXP");setTimeout(checkLevel,800)}else setTimeout(enemyAttack,900)},400)}
function healSkill(){closeModal();if(hero.mp<20){showMessage("MP insuficiente");return}hero.mp-=20;const heal=35;hero.hp=Math.min(hero.maxHp,hero.hp+heal);damageText(hero.x,hero.y-60,"+"+heal,"#55ff78");locked=true;turn="enemy";updateHUD();setTimeout(enemyAttack,700)}
function attemptRun(){if(locked||turn!=="player")return;if(Math.random()<.55){showMessage("¡Has escapado!");locked=true;setTimeout(newEnemy,800)}else{showMessage("¡No puedes escapar!");locked=true;turn="enemy";setTimeout(enemyAttack,700)}}
function openInventory(){openModal(`<h2>🎒 INVENTARIO</h2><div class="modalRow">🧪 Poción de Vida × <span id="modalPotion">${potions}</span><br>Recupera 35 HP.<button class="modalBtn" onclick="usePotion();closeModal()">USAR</button></div><div class="modalRow">🔵 Poción de Maná × 2<br>Recupera 25 MP.<button class="modalBtn" onclick="useManaPotion()">USAR</button></div><button class="modalBtn close" onclick="closeModal()">CERRAR</button>`)}
function useManaPotion(){closeModal();if(hero.mp>=hero.maxMp){showMessage("MP al máximo");return}hero.mp=Math.min(hero.maxMp,hero.mp+25);damageText(hero.x,hero.y-60,"+25","#55aaff");updateHUD()}
function openMissions(){openModal(`<h2>📜 MISIONES</h2><div class="modalRow"><b>El comienzo</b><br>Derrota a 3 Caracoles Verdes.<br><br>Progreso: ${Math.min(kills,3)} / 3</div><div class="modalRow"><b>Camino del Shinobi</b><br>Alcanza el nivel 5.<br><br>Progreso: ${hero.level} / 5</div><button class="modalBtn close" onclick="closeModal()">CERRAR</button>`)}
function openStats(){openModal(`<h2>⚔️ ESTADÍSTICAS</h2><div class="modalRow">Nivel: <b>${hero.level}</b></div><div class="modalRow">Ataque: <b>${hero.atk}</b></div><div class="modalRow">Defensa: <b>${hero.def}</b></div><div class="modalRow">Velocidad: <b>${hero.speed}</b></div><div class="modalRow">EXP: <b>${hero.exp}/${hero.expNext}</b></div><div class="modalRow">Enemigos derrotados: <b>${kills}</b></div><button class="modalBtn close" onclick="closeModal()">CERRAR</button>`)}
let sound=true;function openSettings(){openModal(`<h2>⚙️ AJUSTES</h2><div class="modalRow">Sonido: <b>${sound?"ON":"OFF"}</b><button class="modalBtn" onclick="toggleSound()">CAMBIAR</button></div><button class="modalBtn close" onclick="restartGame()">REINICIAR PARTIDA</button><button class="modalBtn" onclick="closeModal()">CERRAR</button>`)}function toggleSound(){sound=!sound;openSettings()}function openModal(html){document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").style.display="flex"}function closeModal(){document.getElementById("modal").style.display="none"}function showMessage(txt){const el=document.getElementById("message");el.textContent=txt;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,900)}
function updateHUD(){document.getElementById("level").textContent=hero.level;document.getElementById("hpText").textContent=`${hero.hp}/${hero.maxHp}`;document.getElementById("mpText").textContent=`${hero.mp}/${hero.maxMp}`;document.getElementById("expText").textContent=`${hero.exp}/${hero.expNext}`;document.getElementById("hpBar").style.width=`${hero.hp/hero.maxHp*100}%`;document.getElementById("mpBar").style.width=`${hero.mp/hero.maxMp*100}%`;document.getElementById("expBar").style.width=`${hero.exp/hero.expNext*100}%`;document.getElementById("enemyLevel").textContent=enemy.level;document.getElementById("enemyHpText").textContent=`${enemy.hp}/${enemy.maxHp}`;document.getElementById("enemyHpBar").style.width=`${enemy.hp/enemy.maxHp*100}%`;document.getElementById("potionCount").textContent=potions}
function animateValue(from,to,duration,onUpdate,onComplete){const start=performance.now();function frame(now){let p=Math.min(1,(now-start)/duration),e=p<.5?2*p*p:-1+(4-2*p)*p;onUpdate(from+(to-from)*e);if(p<1)requestAnimationFrame(frame);else onComplete&&onComplete()}requestAnimationFrame(frame)}
function gameOver(){document.getElementById("gameOver").style.display="flex"}function restartGame(){closeModal();hero.level=1;hero.hp=120;hero.maxHp=120;hero.mp=50;hero.maxMp=50;hero.exp=0;hero.expNext=100;hero.atk=18;hero.def=8;hero.speed=10;enemy.level=1;enemy.maxHp=60;enemy.hp=45;enemy.atk=9;enemy.alive=true;potions=3;kills=0;hero.x=hero.baseX;enemy.x=enemy.baseX;turn="player";locked=false;document.getElementById("gameOver").style.display="none";updateHUD()}
function drawPortraits(){const h=document.getElementById("heroPortrait"),hc=h.getContext("2d");hc.clearRect(0,0,80,80);hc.fillStyle="#111827";hc.fillRect(0,0,80,80);hc.fillStyle="#d79b72";hc.beginPath();hc.arc(40,38,23,0,Math.PI*2);hc.fill();hc.fillStyle="#090b10";hc.beginPath();hc.moveTo(17,35);hc.lineTo(20,10);hc.lineTo(31,21);hc.lineTo(40,7);hc.lineTo(50,21);hc.lineTo(62,11);hc.lineTo(62,39);hc.closePath();hc.fill();hc.fillStyle="#171b25";hc.fillRect(17,37,46,14);hc.fillStyle="#e6dfc7";hc.fillRect(26,38,8,3);hc.fillRect(46,38,8,3);hc.strokeStyle="#a9272c";hc.lineWidth=5;hc.beginPath();hc.moveTo(45,50);hc.lineTo(72,67);hc.stroke();const e=document.getElementById("enemyPortrait"),ec=e.getContext("2d");ec.clearRect(0,0,80,80);ec.fillStyle="#152116";ec.fillRect(0,0,80,80);ec.fillStyle="#5bbd39";ec.beginPath();ec.ellipse(40,51,28,18,0,0,Math.PI*2);ec.fill();ec.fillStyle="#704629";ec.beginPath();ec.arc(27,40,22,0,Math.PI*2);ec.fill();ec.strokeStyle="#b87c43";ec.lineWidth=3;ec.beginPath();ec.arc(27,40,14,0,Math.PI*2);ec.stroke();ec.strokeStyle="#63ca45";ec.lineWidth=4;ec.beginPath();ec.moveTo(50,42);ec.lineTo(60,14);ec.moveTo(59,45);ec.lineTo(70,19);ec.stroke();ec.fillStyle="#f6dc38";ec.beginPath();ec.arc(60,14,5,0,Math.PI*2);ec.arc(70,19,5,0,Math.PI*2);ec.fill()}
function update(dt,t){hero.animTime+=dt;enemy.animTime+=dt;if(hero.attackTime>0){hero.attackTime-=dt;if(hero.attackTime>0){const p=1-hero.attackTime;hero.x=hero.baseX+Math.sin(Math.min(1,p)*Math.PI)*70}else hero.x=hero.baseX}if(hero.hitTime>0)hero.hitTime-=dt;if(enemy.hitTime>0)enemy.hitTime-=dt}
function render(t){ctx.clearRect(0,0,W,H);drawBackground(t);drawEnemy(t);drawHero(t);drawFloating(1/60)}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt,t);render(t);requestAnimationFrame(loop)}
drawPortraits();updateHUD();requestAnimationFrame(loop);
</script>
</body>
</html>
