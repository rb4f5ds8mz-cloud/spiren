<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiren — Turn Based RPG</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#08090e;
  color:#eee;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}
#game{
  width:min(960px,100%);
  background:#11131b;
  border:1px solid #303342;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px #0008;
}
header{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #292c38;
}
.logo{font-weight:900;letter-spacing:3px}
.badge{font-size:12px;color:#aaa}
#arena{
  position:relative;
  min-height:470px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#30384a 0,#181c27 35%,#090b10 75%);
}
.moon{
  position:absolute;
  width:130px;height:130px;border-radius:50%;
  background:#e9edf2;
  right:11%;top:9%;
  box-shadow:0 0 50px #cbd6ff55;
}
.ground{
  position:absolute;
  left:0;right:0;bottom:0;height:35%;
  background:linear-gradient(#151a22,#090b10);
  border-top:1px solid #343947;
}
#player{
  position:absolute;
  left:19%;
  bottom:17%;
  width:163px;
  image-rendering:auto;
  filter:drop-shadow(0 12px 7px #000b);
  transition:left .25s ease, bottom .25s ease, transform .15s ease;
}
#enemy{
  position:absolute;
  right:18%;
  bottom:20%;
  width:120px;height:130px;
  display:grid;place-items:center;
  font-size:68px;
  filter:drop-shadow(0 15px 8px #000b);
}
.enemy-core{
  width:92px;height:92px;border-radius:45% 55% 50% 50%;
  background:radial-gradient(circle at 35% 30%,#b8e86d,#476b32 55%,#1b2518);
  border:3px solid #172013;
  display:grid;place-items:center;
  box-shadow:inset -10px -12px 0 #0003;
}
.enemy-eyes{font-size:30px}
#hud{
  padding:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  border-top:1px solid #292c38;
}
.panel{
  background:#181b24;
  border:1px solid #303442;
  border-radius:12px;
  padding:12px;
}
.name{font-weight:800;margin-bottom:7px}
.bar{height:12px;background:#090a0e;border-radius:99px;overflow:hidden}
.fill{height:100%;width:100%;background:#55d68b;transition:width .25s}
.enemybar .fill{background:#e75b68}
.stats{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-top:6px}
#actions{
  padding:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
button{
  min-height:48px;
  border:1px solid #3b4050;
  border-radius:10px;
  background:#202430;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
button:hover{background:#292e3d}
button:disabled{opacity:.4;cursor:not-allowed}
#log{
  margin:0 14px 14px;
  padding:12px;
  min-height:52px;
  background:#0b0d12;
  border:1px solid #292c38;
  border-radius:10px;
  color:#c7cbd5;
  font-size:14px;
}
@media(max-width:620px){
  #arena{min-height:390px}
  #player{width:125px;left:12%}
  #enemy{right:9%;transform:scale(.85)}
  #actions{grid-template-columns:1fr}
  #hud{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="game">
<header>
  <div class="logo">SPIREN</div>
  <div class="badge">PROTOTIPO · COMBATE POR TURNOS</div>
</header>

<section id="arena">
  <div class="moon"></div>
  <div class="ground"></div>

  <img id="player" src="player.png" alt="Spiren, protagonista">
  <div id="enemy">
    <div class="enemy-core"><div class="enemy-eyes">●‿●</div></div>
  </div>
</section>

<section id="hud">
  <div class="panel">
    <div class="name">SPIREN · Nv. 1</div>
    <div class="bar"><div id="hp" class="fill"></div></div>
    <div class="stats"><span>PV <b id="hpText">100 / 100</b></span><span>Turno</span></div>
  </div>
  <div class="panel enemybar">
    <div class="name">CRIATURA SOMBRÍA</div>
    <div class="bar"><div id="enemyHp" class="fill"></div></div>
    <div class="stats"><span>PV <b id="enemyHpText">80 / 80</b></span><span id="turnText">Tu turno</span></div>
  </div>
</section>

<div id="actions">
  <button id="attack">⚔️ Ataque</button>
  <button id="skill">🔷 Corte espiritual</button>
  <button id="guard">🛡️ Defender</button>
</div>

<div id="log" aria-live="polite">La criatura te observa. El combate comienza.</div>
</div>

<script>
(() => {
  const hpBar = document.querySelector('#hp');
  const enemyHpBar = document.querySelector('#enemyHp');
  const hpText = document.querySelector('#hpText');
  const enemyHpText = document.querySelector('#enemyHpText');
  const log = document.querySelector('#log');
  const turnText = document.querySelector('#turnText');
  const player = document.querySelector('#player');
  const buttons = [...document.querySelectorAll('#actions button')];

  let hp = 100;
  let enemyHp = 80;
  let guarding = false;
  let busy = false;

  function render(){
    hpBar.style.width = hp + '%';
    enemyHpBar.style.width = Math.max(0, enemyHp / 80 * 100) + '%';
    hpText.textContent = `${hp} / 100`;
    enemyHpText.textContent = `${Math.max(0,enemyHp)} / 80`;
  }

  function lock(v){
    busy = v;
    buttons.forEach(b => b.disabled = v || hp <= 0 || enemyHp <= 0);
  }

  function enemyTurn(){
    if(enemyHp <= 0 || hp <= 0) return;
    turnText.textContent = 'Turno enemigo';
    setTimeout(() => {
      let damage = Math.floor(Math.random()*8)+7;
      if(guarding) damage = Math.floor(damage/2);
      hp = Math.max(0, hp-damage);
      guarding = false;
      player.style.transform = 'translateX(-8px)';
      setTimeout(()=>player.style.transform='',120);
      log.textContent = `La criatura ataca a Spiren y causa ${damage} de daño.`;
      render();
      turnText.textContent = hp > 0 ? 'Tu turno' : 'Derrota';
      lock(false);
    }, 550);
  }

  function action(type){
    if(busy || hp<=0 || enemyHp<=0) return;
    lock(true);

    if(type === 'attack'){
      const damage = Math.floor(Math.random()*7)+10;
      enemyHp = Math.max(0,enemyHp-damage);
      log.textContent = `Spiren golpea con su hoja y causa ${damage} de daño.`;
      player.style.transform = 'translateX(10px) scale(1.03)';
    }

    if(type === 'skill'){
      const damage = Math.floor(Math.random()*10)+16;
      enemyHp = Math.max(0,enemyHp-damage);
      log.textContent = `⚡ Corte espiritual: ${damage} de daño.`;
      player.style.transform = 'translateX(18px) scale(1.06)';
    }

    if(type === 'guard'){
      guarding = true;
      log.textContent = 'Spiren adopta una postura defensiva. El próximo golpe hará la mitad de daño.';
    }

    render();

    setTimeout(() => {
      player.style.transform='';
      if(enemyHp <= 0){
        turnText.textContent='Victoria';
        log.textContent='✨ Victoria. La criatura se desvanece entre las sombras.';
        lock(false);
        return;
      }
      enemyTurn();
    }, 300);
  }

  document.querySelector('#attack').addEventListener('click',()=>action('attack'));
  document.querySelector('#skill').addEventListener('click',()=>action('skill'));
  document.querySelector('#guard').addEventListener('click',()=>action('guard'));
  render();
})();
</script>
</body>
</html>
