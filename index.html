<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIREN</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{width:100vw;height:100dvh;display:grid;grid-template-rows:72px 1fr 116px 48px;background:#050a12;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 18px;border-bottom:1px solid #253753;background:linear-gradient(180deg,#08111f,#040914);z-index:20}
.logo{font-size:36px;font-weight:950;font-style:italic;letter-spacing:3px;color:#fff;text-shadow:4px 0 #b51f3a}
.nav{display:flex;gap:7px}
.nav button{width:94px;height:52px;border:1px solid #304562;border-radius:12px;background:#0a1423;color:#fff;font-size:12px;font-weight:800}
#arena{position:relative;overflow:hidden;background:
 radial-gradient(circle at 67% 22%,#f4f2d9 0 3.7%,transparent 3.9%),
 radial-gradient(circle at 67% 22%,#d8e2ff44 0 9%,transparent 18%),
 linear-gradient(180deg,#071426 0%,#0c2541 48%,#173044 66%,#0a1119 100%)}
#arena:before{content:"";position:absolute;inset:0;z-index:0;background:
 radial-gradient(ellipse at 20% 48%,#07111e 0 14%,transparent 15%),
 radial-gradient(ellipse at 35% 53%,#091523 0 18%,transparent 19%),
 radial-gradient(ellipse at 84% 47%,#07111e 0 18%,transparent 19%),
 linear-gradient(160deg,transparent 0 52%,#152b35 52% 62%,transparent 62%),
 linear-gradient(200deg,transparent 0 55%,#102632 55% 65%,transparent 65%);
 opacity:.95}
#arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;z-index:1;background:
 linear-gradient(175deg,transparent 0 18%,#1c2c36 18% 20%,transparent 20%),
 repeating-linear-gradient(170deg,transparent 0 18px,#263943 19px 22px,transparent 23px 36px),
 linear-gradient(180deg,#172a31,#080e15 82%)}
.moon{position:absolute;z-index:2;width:112px;height:112px;border-radius:50%;right:24%;top:7%;background:#f4f0d4;box-shadow:0 0 55px #b9d4ff88}
.moon:after{content:"";position:absolute;width:20px;height:13px;border-radius:50%;left:25px;top:30px;background:#d9d6bf66;box-shadow:34px 30px 0 #d9d6bf55,48px 12px 0 #d9d6bf44}
.mountains{position:absolute;z-index:1;left:0;right:0;bottom:31%;height:40%;background:
 linear-gradient(145deg,transparent 0 31%,#0b1a28 31.2% 55%,transparent 55.2%),
 linear-gradient(35deg,transparent 0 35%,#0e2030 35.2% 62%,transparent 62.2%);
 opacity:.95}
.torii{position:absolute;z-index:2;left:39%;top:31%;width:190px;height:125px;border-left:13px solid #3a2021;border-right:13px solid #3a2021}
.torii:before{content:"";position:absolute;left:-35px;top:0;width:260px;height:13px;background:#351d1f;border-radius:5px;box-shadow:0 17px 0 #4a2525}
.torii:after{content:"";position:absolute;left:18px;top:18px;width:128px;height:9px;background:#4a2525;box-shadow:0 9px 0 #26171a}
.temple{position:absolute;z-index:2;right:12%;top:27%;width:115px;height:78px;background:linear-gradient(90deg,#111923,#253444);clip-path:polygon(15% 25%,50% 0,85% 25%,100% 35%,50% 23%,0 35%,20% 35%,20% 100%,80% 100%,80% 35%);filter:drop-shadow(0 8px 8px #0008)}
.temple:after{content:"";position:absolute;left:45%;top:42%;width:10px;height:22px;background:#d69b35;box-shadow:0 25px 0 #d69b35}
.lantern{position:absolute;z-index:3;width:16px;height:28px;background:#d49a38;border-radius:5px;box-shadow:0 0 20px #ffbe45aa}
.l1{left:17%;top:50%}.l2{left:31%;top:54%}.l3{right:29%;top:53%}.l4{right:13%;top:48%}
.ground{position:absolute;left:0;right:0;bottom:0;height:35%;z-index:2;background:
 repeating-linear-gradient(168deg,transparent 0 13px,#344952 14px 16px,transparent 17px 28px),
 linear-gradient(180deg,#1c3037,#080e15 82%);clip-path:polygon(0 20%,100% 0,100% 100%,0 100%)}
.card{position:absolute;top:12px;z-index:8;width:32%;padding:9px 13px;border:1px solid #304563;border-radius:14px;background:#06101ddd;backdrop-filter:blur(4px)}
.left{left:14px}.right{right:14px}
.card b{font-size:16px}.bar{height:10px;background:#02050a;border-radius:9px;margin-top:6px;overflow:hidden}.hp{height:100%;background:#ff4055;width:100%}.en{height:100%;background:#19a9ff;width:100%;margin-top:4px}.stats{display:flex;justify-content:space-between;font-size:11px;color:#cbd5e5;margin-top:4px}
#ninja{position:absolute;z-index:6;left:16%;bottom:6%;width:min(25vw,310px);height:auto;filter:drop-shadow(0 15px 8px #000b)}
.snail{position:absolute;z-index:6;right:13%;bottom:10%;width:min(14vw,210px);aspect-ratio:1/.8;border-radius:48%;background:linear-gradient(145deg,#b8f63d,#38661d);box-shadow:0 15px 25px #000b,0 0 28px #9cff3d66}
.snail:after{content:"";position:absolute;right:8%;top:18%;width:58%;height:62%;border-radius:50%;background:radial-gradient(circle,#101712 0 8%,#354328 9% 15%,#12180f 16% 22%,#52613d 23% 28%,#171c13 29% 100%);border:4px solid #17200f}
.eye{position:absolute;left:22%;top:35%;font-size:24px;color:#efffb4;text-shadow:0 0 14px #d8ff55}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:9px 16px;background:#050b15;border-top:1px solid #243651;z-index:20}
.action{border-radius:14px;background:#091322;color:#fff;font-weight:900;font-size:20px;border:2px solid;padding:9px}.a{border-color:#ff4055}.s{border-color:#1b9cff}.g{border-color:#d8a32c}.i{border-color:#1bc875}
.action:active{transform:translateY(2px);filter:brightness(1.25)}
.log{padding:8px 18px;background:#050b15;border-top:1px solid #263958;font-size:13px;color:#d5deed;z-index:20}
@media(max-width:800px) and (orientation:landscape){
 #game{grid-template-rows:58px 1fr 94px 39px}
 header{padding:4px 10px}.logo{font-size:26px}.nav{gap:4px}.nav button{width:68px;height:43px;font-size:9px}
 .card{top:7px;padding:6px 9px;width:31%}.card b{font-size:11px}.bar{height:7px;margin-top:4px}.stats{font-size:9px}
 .moon{width:78px;height:78px}.torii{left:38%;top:33%;transform:scale(.7);transform-origin:top left}.temple{right:11%;top:30%;transform:scale(.75);transform-origin:top right}
 #ninja{width:24vw;left:15%;bottom:7%}.snail{width:15vw;right:12%;bottom:9%}
 .action{font-size:13px;padding:5px}.actions{gap:7px;padding:6px 10px}.log{font-size:11px;padding:6px 12px}
}
@media(orientation:portrait){body:after{content:"GIRA EL IPHONE PARA JUGAR";position:fixed;inset:0;display:grid;place-items:center;background:#030712;color:white;font-size:22px;font-weight:900;z-index:99;text-align:center}}
