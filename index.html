<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SPIREN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#05070b;overflow:hidden}
body{display:grid;place-items:center}
#screen{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#05070b}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer}
.hot:active{background:rgba(255,255,255,.08)}
#inventory{left:.8%;top:26%;width:9%;height:10%}
#missions{left:.8%;top:39%;width:9%;height:10%}
#stats{left:.8%;top:51%;width:9%;height:10%}
#settings{left:.8%;top:64%;width:9%;height:10%}
#attack{left:3%;bottom:1%;width:18%;height:15%}
#skill{left:22%;bottom:1%;width:18%;height:15%}
#item{left:41%;bottom:1%;width:18%;height:15%}
#flee{left:60%;bottom:1%;width:18%;height:15%}
#potion{right:2%;bottom:2%;width:7%;height:13%}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.68);z-index:20;padding:5vw}
#modal.open{display:flex}
.panel{width:min(620px,88vw);min-height:260px;border:3px solid #b88a43;border-radius:18px;background:linear-gradient(145deg,#101827,#070b12);box-shadow:0 20px 60px #000;position:relative;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:28px}
.panel h2{margin:0 0 10px;font-size:30px;color:#ffd36a;text-transform:uppercase}
.panel p{color:#cbd5e1;font-size:17px}
.close{position:absolute;right:14px;top:10px;border:1px solid #80612f;background:#17110a;color:#fff;border-radius:10px;width:42px;height:38px;font-size:22px}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.modal-grid div{border:1px solid #374151;border-radius:10px;padding:16px;background:#0b1220;text-align:center}
#toast{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);z-index:15;display:none;background:#080b12e8;border:1px solid #b88a43;color:#fff;border-radius:12px;padding:10px 18px;font:700 15px system-ui}
@media (orientation:portrait){
#screen:after{content:"GIRA EL IPHONE PARA JUGAR";position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#05070b;color:white;font:900 22px system-ui;text-align:center}
}
</style>

<button class="hot" id="inventory" aria-label="Inventario"></button>
<button class="hot" id="missions" aria-label="Misiones"></button>
<button class="hot" id="stats" aria-label="Estadísticas"></button>
<button class="hot" id="settings" aria-label="Ajustes"></button>
<button class="hot" id="attack" aria-label="Atacar"></button>
<button class="hot" id="skill" aria-label="Habilidad"></button>
<button class="hot" id="item" aria-label="Objeto"></button>
<button class="hot" id="flee" aria-label="Huir"></button>
<button class="hot" id="potion" aria-label="Poción"></button>
<div id="toast"></div>
<div id="modal">
  <div class="panel">
    <button class="close" id="close">×</button>
    <h2 id="title">SPIREN</h2>
    <p id="desc">Interfaz preparada. En la siguiente fase desarrollaremos este menú.</p>
    <div class="modal-grid">
      <div>VISUAL</div><div>CONTENIDO</div><div>ACCIONES</div>
    </div>
  </div>
</div>
</div>
<script>
const modal=document.getElementById('modal'), title=document.getElementById('title'), desc=document.getElementById('desc'), toast=document.getElementById('toast');
function menu(name,text){title.textContent=name;desc.textContent=text;modal.classList.add('open')}
document.getElementById('close').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.getElementById('inventory').onclick=()=>menu('INVENTARIO','Acceso creado. Aquí construiremos los 60 huecos, equipo, objetos y estadísticas de inventario.');
document.getElementById('missions').onclick=()=>menu('MISIONES','Acceso creado. Aquí construiremos las misiones, objetivos y recompensas.');
document.getElementById('stats').onclick=()=>menu('ESTADÍSTICAS','Acceso creado. Aquí construiremos atributos, nivel, experiencia, daño y defensa.');
document.getElementById('settings').onclick=()=>menu('AJUSTES','Acceso creado. Aquí construiremos las opciones del juego.');
document.getElementById('attack').onclick=()=>show('⚔️ ATAQUE');
document.getElementById('skill').onclick=()=>show('🌙 HABILIDAD');
document.getElementById('item').onclick=()=>show('🧪 OBJETO');
document.getElementById('flee').onclick=()=>show('🏃 HUIR');
document.getElementById('potion').onclick=()=>menu('OBJETO','Poción seleccionada. El sistema de objetos se desarrollará después.');
function show(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',1200)}
</script>
