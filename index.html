<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>SPIREN — Ninja Roguelite</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a11;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;height:100%;max-width:1100px;overflow:hidden;background:#101827}
canvas{display:block;width:100%;height:100%;background:#111827}
button{font:inherit;color:inherit}
#hud{position:absolute;inset:0;pointer-events:none}
#brand{position:absolute;top:12px;left:14px;font-weight:900;font-size:28px;letter-spacing:4px;text-shadow:0 3px 12px #000}
#stats{position:absolute;top:50px;left:14px;width:min(310px,48vw)}
.bar{height:13px;border:2px solid #000;border-radius:9px;background:#252b37;overflow:hidden;box-shadow:0 2px 8px #0008}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#d93636,#ff5a5a)}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#35a8ff,#8c7bff)}
#levelText{font-size:12px;font-weight:800;margin:3px 0}
#room{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-weight:800;background:#090c14c9;border:1px solid #ffffff22;border-radius:18px;padding:7px 14px}
#coins{position:absolute;top:16px;right:60px;font-weight:800;background:#090c14c9;border-radius:18px;padding:7px 12px}
#pause{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff44;background:#111827cc;pointer-events:auto}
#joystick{position:absolute;left:0;top:0;width:130px;height:130px;display:none;border:2px solid #ffffff33;border-radius:50%;background:#0b1020a8;pointer-events:auto}
#stick{position:absolute;left:37px;top:37px;width:52px;height:52px;border-radius:50%;background:#dbe7ff33;border:2px solid #ffffff55}
#attack{position:absolute;right:24px;bottom:28px;width:92px;height:92px;border-radius:50%;border:2px solid #ffffff44;background:#18233bcc;pointer-events:auto;font-size:36px}
#skills{position:absolute;right:22px;bottom:130px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.skillBadge{font-size:12px;font-weight:800;background:#0b1020d9;border:1px solid #ffffff2a;border-radius:14px;padding:7px 10px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05070ddd;padding:18px;pointer-events:auto}
.panel{width:min(760px,94vw);background:#101827f2;border:1px solid #ffffff22;border-radius:24px;padding:22px;box-shadow:0 20px 80px #000}
.panel h1{margin:0 0 6px;font-size:30px}
.panel p{margin:6px 0 16px;color:#aab5c8}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{min-height:150px;text-align:left;border:1px solid #ffffff24;border-radius:18px;background:#172033;padding:15px;cursor:pointer}
.card:active{transform:scale(.98)}
.card b{display:block;font-size:18px;margin-bottom:8px}
.card small{color:#aab5c8;line-height:1.35}
#startBtn{padding:14px 24px;border:0;border-radius:15px;background:#6d5dfc;font-weight:900;cursor:pointer}

/* Pantalla inicial */
#startScreen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 38%,#263b59 0,#0b111d 48%,#05070c 100%);pointer-events:auto;overflow:hidden}
#startScreen:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 70px,#ffffff08 71px 73px);transform:rotate(-8deg);opacity:.35}
.startPanel{position:relative;width:min(430px,92vw);text-align:center;padding:34px 24px 28px;border:1px solid #ffffff25;border-radius:30px;background:#080d17d9;box-shadow:0 25px 90px #000b,0 0 45px #6d5dfc22;backdrop-filter:blur(10px)}
.startLogo{font-size:clamp(48px,15vw,82px);font-weight:1000;letter-spacing:10px;line-height:.95;text-shadow:0 0 30px #6d5dfc88,0 8px 30px #000}
.startSub{margin:12px 0 28px;color:#9eabc0;font-size:13px;letter-spacing:4px;text-transform:uppercase}
.levelCard{margin:0 auto 24px;width:min(280px,80%);padding:15px;border:1px solid #ffffff1f;border-radius:18px;background:#111a2ad9}
.levelCard small{display:block;color:#8492aa;font-size:11px;letter-spacing:3px;margin-bottom:5px}
.levelCard strong{display:block;font-size:30px;letter-spacing:2px}
#startGameBtn{width:min(280px,82%);padding:16px 20px;border:0;border-radius:16px;background:linear-gradient(135deg,#7c6cff,#5545df);font-weight:950;font-size:17px;letter-spacing:1px;box-shadow:0 10px 30px #5144df55;cursor:pointer}
#startGameBtn:active{transform:scale(.97)}
.startHint{margin:18px 0 0;color:#68758b;font-size:11px}

@media(max-width:600px){
 #brand{font-size:22px;top:9px}
 #stats{top:39px;width:190px}
 #room{font-size:12px;top:11px}
 #coins{top:11px;right:53px;font-size:12px}
 .cards{grid-template-columns:1fr}
 .card{min-height:92px}
 #joystick{width:118px;height:118px}
 #stick{left:33px;top:33px}
}

@media (orientation:portrait) and (max-width:900px){
 #brand{font-size:22px;letter-spacing:3px}
 #stats{top:42px;width:190px}
 #room{top:12px;font-size:12px;padding:6px 12px}
 #coins{top:12px;right:53px;font-size:12px;padding:6px 10px}
 #pause{top:10px;right:10px;width:42px;height:42px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud">
  <div id="brand">SPIREN</div>
  <div id="stats">
    <div class="bar"><div id="hpFill"></div></div>
    <div id="levelText">NV. 1 · XP 0/40</div>
    <div class="bar" style="height:7px"><div id="xpFill"></div></div>
  </div>
  <div id="room">SALA 1/10</div>
  <div id="coins">🪙 0</div>
  <button id="pause" aria-label="Pausar">Ⅱ</button>
  <div id="skills"></div>
  <div id="joystick"><div id="stick"></div></div>
</div>

<div id="startScreen">
  <div class="startPanel">
    <div class="startLogo">SPIREN</div>
    <div class="startSub">Ninja Roguelite</div>
    <div class="levelCard">
      <small>PRÓXIMA MISIÓN</small>
      <strong>NIVEL 1</strong>
    </div>
    <button id="startGameBtn">⚔ COMENZAR</button>
    <div class="startHint">Muévete con el joystick · 8 direcciones · Ataque automático al detenerte</div>
  </div>
</div>

<div id="overlay">
  <div class="panel" id="panel"></div>
</div>
</div>

const state={
 room:1, maxRooms:10, coins:0, kills:0, projectiles:[], enemies:[], particles:[],
 player:{x:0,y:0,r:18,hp:100,maxHp:100,speed:210,damage:24,fireRate:.52,cooldown:0,level:1,xp:0,nextXp:40,inv:0,dir:"down",animFrame:0,animTime:0},
 upgrades:{shuriken:0,fire:0,speed:0,multishot:0,crit:0,orb:0},
 roomCleared:false,spawnTimer:0,roomTimer:0,boss:false
};
const input={x:0,y:0,attack:false};
const keys={};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize); resize();

function worldBounds(){return {l:25,r:W-25,t:78,b:H-25}}
function resetRoom(){
 const b=worldBounds(); state.player.x=W/2;state.player.y=H/2;
 state.enemies.length=0;state.projectiles.length=0;state.particles.length=0;
 state.roomCleared=false;state.roomTimer=0;state.spawnTimer=0;
 state.boss=state.room===state.maxRooms;
 const count=state.boss?1:Math.min(4+state.room*2,22);
 for(let i=0;i<count;i++) spawnEnemy(i===0&&state.boss?"boss":(Math.random()<.22?"ranged":"melee"));
 roomEl.textContent=`SALA ${state.room}/${state.maxRooms}`;
}
function spawnEnemy(type){
 const b=worldBounds();let x,y,edge=Math.floor(Math.random()*4);
 if(edge===0){x=rand(b.l,b.r);y=b.t}
 if(edge===1){x=b.r;y=rand(b.t,b.b)}
 if(edge===2){x=rand(b.l,b.r);y=b.b}
 if(edge===3){x=b.l;y=rand(b.t,b.b)}
 const scale=1+(state.room-1)*.13;
 let e;
 if(type==="boss") e={type,x,y,r:48,hp:1300*scale,maxHp:1300*scale,speed:48,damage:30,cool:1.2,color:"#8b5cf6",elite:true};
 else if(type==="ranged") e={type,x,y,r:15,hp:75*scale,maxHp:75*scale,speed:58,damage:10,cool:rand(.3,1.4),color:"#f59e0b"};
 else e={type,x,y,r:17,hp:95*scale,maxHp:95*scale,speed:72,damage:14,cool:.8,color:"#ef4444"};
 state.enemies.push(e);
}
function burst(x,y,color,n=8){
 for(let i=0;i<n;i++)state.particles.push({x,y,vx:rand(-120,120),vy:rand(-120,120),life:rand(.25,.6),max:.6,color,r:rand(2,5)});
}
function shootAt(e){
 const p=state.player,dx=e.x-p.x,dy=e.y-p.y,len=Math.hypot(dx,dy)||1;
 const count=1+state.upgrades.multishot;
 for(let i=0;i<count;i++){
  const spread=(i-(count-1)/2)*.14,cs=Math.cos(spread),sn=Math.sin(spread);
  const vx=(dx/len*cs-dy/len*sn)*560,vy=(dx/len*sn+dy/len*cs)*560;
  state.projectiles.push({x:p.x,y:p.y,vx,vy,r:6,damage:p.damage+(state.upgrades.fire*7),life:1.3,crit:false});
 }
}
function autoAttack(dt){
 const p=state.player;
 const moving=Math.abs(input.x)>0.05||Math.abs(input.y)>0.05||
   keys.w||keys.s||keys.a||keys.d||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight;

 // Mientras se mueve, el ninja no ataca y reinicia la cadencia.
 if(moving){
  p.cooldown=0;
  return;
 }

 p.cooldown-=dt;
 if(p.cooldown>0)return;
 let target=null,best=Infinity;
 for(const e of state.enemies){
  const d=dist(p,e);
  if(d<best){best=d;target=e}
 }
 if(target){
  shootAt(target);
  p.cooldown=Math.max(.16,p.fireRate*(1-state.upgrades.speed*.05));
 }
}
function damageEnemy(e,amount){
 const crit=Math.random()<Math.min(.45,state.upgrades.crit*.08);
 const dmg=amount*(crit?1.8:1);e.hp-=dmg;
 burst(e.x,e.y,crit?"#fde047":"#7dd3fc",crit?7:3);
 if(e.hp<=0){
  state.kills++;state.coins+=e.elite?50:Math.ceil(rand(2,7));
  burst(e.x,e.y,e.elite?"#a78bfa":"#fbbf24",e.elite?30:10);
  e.dead=true;
 }
}
function gainXp(v){
 const p=state.player;p.xp+=v;
 if(p.xp>=p.nextXp){p.xp-=p.nextXp;p.level++;p.nextXp=Math.floor(p.nextXp*1.32);p.hp=Math.min(p.maxHp,p.hp+25);showLevelUp()}
}
function showLevelUp(){
 paused=true;overlay.style.display="flex";
 const opts=[
  {id:"shuriken",name:"Shuriken múltiple",desc:"+1 proyectil por ataque"},
  {id:"fire",name:"Corte ígneo",desc:"+7 daño y proyectiles incendiados"},
  {id:"speed",name:"Paso sombra",desc:"+5% cadencia y velocidad"},
  {id:"multishot",name:"Tormenta ninja",desc:"+1 proyectil adicional"},
  {id:"crit",name:"Ojo del asesino",desc:"+8% probabilidad de crítico"},
  {id:"orb",name:"Esfera espiritual",desc:"Añade un orbe protector que daña enemigos"}
 ];
 const choices=[];while(choices.length<3){const o=opts[Math.floor(Math.random()*opts.length)];if(!choices.includes(o))choices.push(o)}
 panel.innerHTML=`<h1>¡SUBE DE NIVEL!</h1><p>Nivel ${state.player.level}. Elige una mejora:</p><div class="cards">${choices.map((o,i)=>`<button class="card" data-i="${i}"><b>${o.name}</b><small>${o.desc}</small></button>`).join("")}</div>`;
 panel.querySelectorAll(".card").forEach((b,i)=>b.addEventListener("click",()=>{state.upgrades[choices[i].id]++;overlay.style.display="none";paused=false;updateHUD()}));
}
function updateHUD(){
 const p=state.player;
 hpFill.style.width=`${clamp(p.hp/p.maxHp*100,0,100)}%`;
 xpFill.style.width=`${clamp(p.xp/p.nextXp*100,0,100)}%`;
 levelText.textContent=`NV. ${p.level} · XP ${Math.floor(p.xp)}/${p.nextXp}`;
 coinsEl.textContent=`🪙 ${state.coins}`;
 const names=[["shuriken","✦"],["fire","🔥"],["speed","💨"],["multishot","✦"],["crit","🎯"],["orb","●"]];
 skillsEl.innerHTML=names.filter(x=>state.upgrades[x[0]]>0).map(x=>`<div class="skillBadge">${x[1]} ${state.upgrades[x[0]]}</div>`).join("");
}
function playerHit(dmg){
 const p=state.player;if(p.inv>0)return;p.hp-=dmg;p.inv=.45;shake=8;burst(p.x,p.y,"#ef4444",8);if(p.hp<=0)gameOver();
}
function gameOver(){
 paused=true;overlay.style.display="flex";
 panel.innerHTML=`<h1>Has caído</h1><p>Has llegado a la sala ${state.room}. Enemigos derrotados: ${state.kills}.</p><button id="startBtn">REINTENTAR</button>`;
 document.getElementById("startBtn").onclick=()=>location.reload();
}
function victory(){
 paused=true;overlay.style.display="flex";
 panel.innerHTML=`<h1>SPIREN COMPLETADO</h1><p>Has derrotado al jefe y completado las ${state.maxRooms} salas.</p><p>Monedas: ${state.coins} · Enemigos: ${state.kills}</p><button id="startBtn">JUGAR DE NUEVO</button>`;
 document.getElementById("startBtn").onclick=()=>location.reload();
}
function update(dt){
 if(paused)return;
 const p=state.player;p.inv=Math.max(0,p.inv-dt);
 let ix=input.x,iy=input.y;
 if(keys.w||keys.ArrowUp)iy-=1;if(keys.s||keys.ArrowDown)iy+=1;if(keys.a||keys.ArrowLeft)ix-=1;if(keys.d||keys.ArrowRight)ix+=1;
 const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
 const moving=len>0.05;
 if(moving){
  // Ocho direcciones físicas y ocho ciclos de animación reales.
  const angle=Math.atan2(iy,ix);
  const sector=((Math.round(angle/(Math.PI/4))+8)%8);
  const dirs=["right","down-right","down","down-left","left","up-left","up","up-right"];
  p.dir=dirs[sector];
  p.animTime+=dt;
  if(p.animTime>=.11){
   p.animTime=0;
   p.animFrame=(p.animFrame+1)%4;
  }
 }else{
  p.animTime=0;
  p.animFrame=0;
 }
 p.x+=ix*p.speed*dt;p.y+=iy*p.speed*dt;
 const b=worldBounds();p.x=clamp(p.x,b.l+p.r,b.r-p.r);p.y=clamp(p.y,b.t+p.r,b.b-p.r);
 autoAttack(dt);
 for(const pr of state.projectiles){
  pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;
  for(const e of state.enemies)if(!e.dead&&Math.hypot(pr.x-e.x,pr.y-e.y)<pr.r+e.r){damageEnemy(e,pr.damage);pr.life=0;break}
 }
 state.projectiles=state.projectiles.filter(x=>x.life>0);
 for(const e of state.enemies){
  if(e.dead)continue;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.type==="ranged"){
   if(d>220){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}
   else if(d<150){e.x-=dx/d*e.speed*dt;e.y-=dy/d*e.speed*dt}
   e.cool-=dt;if(e.cool<=0&&d<420){const vx=dx/d*260,vy=dy/d*260;state.projectiles.push({x:e.x,y:e.y,vx,vy,r:5,damage:e.damage,life:2,enemy:true});e.cool=1.5}
  }else{
   e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.cool-=dt;
   if(d<e.r+p.r+3&&e.cool<=0){playerHit(e.damage);e.cool=e.type==="boss"?.7:.95}
  }
 }
 if(state.upgrades.orb>0){
  const rad=48+state.upgrades.orb*5;
  for(const e of state.enemies)if(!e.dead&&Math.abs(Math.hypot(e.x-p.x,e.y-p.y)-rad)<e.r+7)damageEnemy(e,35*dt*state.upgrades.orb);
 }
 for(const q of state.particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt}
 state.particles=state.particles.filter(q=>q.life>0);
 state.enemies=state.enemies.filter(e=>{
  if(e.dead){gainXp(e.elite?40:12);return false}return true
 });
 if(state.enemies.length===0&&!state.roomCleared){
  state.roomCleared=true;state.roomTimer=1.1;
 }
 if(state.roomCleared){state.roomTimer-=dt;if(state.roomTimer<=0){if(state.room>=state.maxRooms)victory();else{state.room++;resetRoom()}}}
 updateHUD();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // No se dibujan números/debug sobre el personaje.
 ctx.font="";
 const b=worldBounds();
 ctx.fillStyle="#142019";ctx.fillRect(0,0,W,H);
 for(let y=b.t;y<b.b;y+=42)for(let x=b.l;x<b.r;x+=42){
  ctx.fillStyle=((x/42+y/42)&1)?"#17271f":"#192b22";ctx.fillRect(x,y,42,42)
 }
 ctx.fillStyle="#0b2b3b";ctx.fillRect(0,78,115,125);ctx.fillRect(W-115,H-120,115,120);
 ctx.strokeStyle="#315b5a";ctx.lineWidth=3;ctx.strokeRect(3,81,109,119);
 for(let i=0;i<18;i++){let x=(i*83+31)%Math.max(100,W-50)+25,y=100+(i*47)%(Math.max(100,H-145));ctx.fillStyle="#34423d";ctx.fillRect(x,y,18,12)}
 for(const pr of state.projectiles){ctx.save();ctx.translate(pr.x,pr.y);ctx.rotate(Math.atan2(pr.vy,pr.vx));ctx.fillStyle=pr.enemy?"#fb923c":"#dbeafe";ctx.shadowBlur=pr.enemy?8:14;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-4);ctx.lineTo(-2,0);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();ctx.restore()}
 for(const e of state.enemies)drawEnemy(e);
 drawPlayer(state.player);
 for(const q of state.particles){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 if(shake>0){shake*=.9}
}
function drawPlayer(p){
 ctx.save();
 ctx.translate(p.x,p.y);
 if(p.inv>0)ctx.globalAlpha=.55;

 // El punto p.x/p.y corresponde a los pies del ninja.
 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(0,2,22,7,0,0,Math.PI*2);
 ctx.fill();

 if(ninjaSprite.complete&&ninjaSprite.naturalWidth){
  const size=94;
  const row=SPRITE_ROWS[p.dir] ?? SPRITE_ROWS.down;
  const sx=p.animFrame*SPRITE_SIZE;
  const sy=row*SPRITE_SIZE;

  ctx.imageSmoothingEnabled=true;

  // Ancla cada frame por el centro de apoyo de los pies para que el
  // personaje quede perfectamente centrado sobre su sombra.
  const dx = -size/2;

  ctx.drawImage(
   ninjaSprite,
   sx,sy,SPRITE_SIZE,SPRITE_SIZE,
   dx,-size+2,size,size
  );
 }

 if(state.upgrades.orb>0){
  ctx.strokeStyle="#60a5fa66";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,-24,48+state.upgrades.orb*5,0,Math.PI*2);
  ctx.stroke();
 }
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);

 ctx.fillStyle="#0007";
 ctx.beginPath();
 ctx.ellipse(0,e.r*.78,e.r*1.05,e.r*.30,0,0,Math.PI*2);
 ctx.fill();

 if(e.elite){
  ctx.strokeStyle="#c4b5fd66";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.arc(0,0,e.r+7,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle=e.color;
  ctx.beginPath();
  ctx.arc(0,0,e.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f5f3ff";
  ctx.beginPath();
  ctx.arc(-15,-8,7,0,Math.PI*2);
  ctx.arc(15,-8,7,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#191827";
  ctx.beginPath();
  ctx.arc(-15,-8,3,0,Math.PI*2);
  ctx.arc(15,-8,3,0,Math.PI*2);
  ctx.fill();
 }else{
  // Cuerpo de caracol.
  ctx.fillStyle="#f3d8bd";
  ctx.beginPath();
  ctx.ellipse(e.r*.25,e.r*.42,e.r*.78,e.r*.48,0,0,Math.PI*2);
  ctx.fill();

  // Caparazón.
  ctx.fillStyle=e.type==="ranged"?"#f59e0b":"#67b84b";
  ctx.beginPath();
  ctx.arc(-e.r*.18,-e.r*.05,e.r*.72,0,Math.PI*2);
  ctx.fill();

  // Espiral.
  ctx.strokeStyle="#315b38";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(-e.r*.18,-e.r*.05,e.r*.34,.2,Math.PI*1.75);
  ctx.stroke();

  // Antenas.
  ctx.strokeStyle="#d8b99e";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(e.r*.42,-e.r*.12);
  ctx.lineTo(e.r*.58,-e.r*.68);
  ctx.moveTo(e.r*.66,-e.r*.02);
  ctx.lineTo(e.r*.78,-e.r*.56);
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(e.r*.58,-e.r*.68,4,0,Math.PI*2);
  ctx.arc(e.r*.78,-e.r*.56,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#1b1b22";
  ctx.beginPath();
  ctx.arc(e.r*.58,-e.r*.68,1.8,0,Math.PI*2);
  ctx.arc(e.r*.78,-e.r*.56,1.8,0,Math.PI*2);
  ctx.fill();
 }

 const w=e.r*2.2;
 ctx.fillStyle="#180d12";
 ctx.fillRect(-w/2,-e.r-15,w,6);
 ctx.fillStyle=e.elite?"#a78bfa":"#ef4444";
 ctx.fillRect(-w/2,-e.r-15,w*clamp(e.hp/e.maxHp,0,1),6);

 ctx.restore();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
resetRoom();updateHUD();
paused=true;
startGameBtn.addEventListener("click",()=>{startScreen.style.display="none";paused=false;});
requestAnimationFrame(loop);

// keyboard
addEventListener("keydown",e=>{keys[e.key]=true});
addEventListener("keyup",e=>{keys[e.key]=false});

// joystick pointer control
const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
const gameEl=document.getElementById("game");
let joyId=null;
function placeJoystick(x,y){
 const size=joy.offsetWidth||118;
 const half=size/2;
 const margin=8;
 const px=Math.max(margin,Math.min(x-half,gameEl.clientWidth-size-margin));
 const py=Math.max(margin,Math.min(y-half,gameEl.clientHeight-size-margin));
 joy.style.left=`${px}px`;
 joy.style.top=`${py}px`;
}
function joyMove(e){
 if(joyId!==e.pointerId)return;
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const m=r.width*.34,len=Math.hypot(dx,dy);
 if(len>m){dx=dx/len*m;dy=dy/len*m}
 input.x=dx/m;
 input.y=dy/m;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
gameEl.addEventListener("pointerdown",e=>{
 if(paused || e.target.closest("#pause") || e.target.closest("#overlay"))return;
 if(joyId!==null)return;
 joyId=e.pointerId;
 placeJoystick(e.clientX,e.clientY);
 joy.style.display="block";
 joy.setPointerCapture?.(e.pointerId);
 joyMove(e);
});
joy.addEventListener("pointermove",joyMove);
joy.addEventListener("pointerup",e=>{
 if(joyId===e.pointerId){
  joyId=null;
  input.x=input.y=0;
  stick.style.transform="";
  joy.style.display="none";
 }
});
joy.addEventListener("pointercancel",e=>{
 if(joyId===e.pointerId){
  joyId=null;
  input.x=input.y=0;
  stick.style.transform="";
  joy.style.display="none";
 }
});
document.getElementById("pause").addEventListener("click",()=>{
 paused=!paused;if(paused){overlay.style.display="flex";panel.innerHTML=`<h1>Pausa</h1><p>SPIREN está detenido.</p><button id="startBtn">CONTINUAR</button>`;document.getElementById("startBtn").onclick=()=>{overlay.style.display="none";paused=false}}
 else overlay.style.display="none";
});
})();
</script>
</body>
