<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SPIREN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
body{display:grid;place-items:center}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#05070b}
#game{position:relative;width:min(100vw,calc(100dvh * 1672 / 940));height:min(100dvh,calc(100vw * 940 / 1672));aspect-ratio:1672/940;overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;z-index:5;touch-action:manipulation}
.hot:active{background:rgba(255,255,255,.06)}
#inventory{left:1%;top:25%;width:10%;height:12%}
#missions{left:1%;top:38%;width:10%;height:12%}
#stats{left:1%;top:51%;width:10%;height:12%}
#settings{left:1%;top:64%;width:10%;height:12%}
#attack{left:2%;bottom:2%;width:19%;height:16%}
#skill{left:22%;bottom:2%;width:19%;height:16%}
#item{left:42%;bottom:2%;width:19%;height:16%}
#flee{left:62%;bottom:2%;width:19%;height:16%}
#potion{right:1%;bottom:2%;width:8%;height:18%}
#portrait{display:none;position:fixed;inset:0;z-index:20;place-items:center;background:#05070b;color:#fff;font:700 18px system-ui;text-align:center}
@media (orientation:portrait){#portrait{display:grid}#game{display:none}}

#attacker{display:none}
#slash{display:none}
#impact{display:none}
#damage{display:none}
#enemyHpFill{position:absolute;left:72.1%;top:9.65%;width:17.25%;height:2.9%;z-index:4;pointer-events:none;background:#e92620;border-radius:5px;transform-origin:left center;}
#enemyHpText{position:absolute;left:80.7%;top:9.55%;z-index:5;pointer-events:none;color:#fff;font:900 20px Arial,sans-serif;text-shadow:2px 2px 0 #000;transform:translateX(-50%);}
#attack.locked{pointer-events:none;opacity:.7}
#attackSprite{position:absolute;left:250px;top:410px;width:330px;height:330px;object-fit:contain;z-index:3;pointer-events:none;display:none;image-rendering:auto;will-change:transform,opacity}
#attackSmoke{position:absolute;left:230px;top:415px;width:370px;height:320px;object-fit:fill;z-index:2;pointer-events:none;display:none;opacity:0;will-change:opacity,transform}
#attackSlash{position:absolute;width:260px;height:200px;object-fit:contain;z-index:4;pointer-events:none;display:none;opacity:0;will-change:opacity,transform}
@keyframes attackSmokeIn{0%{opacity:0;transform:scale(.72)}35%{opacity:.72;transform:scale(1.02)}100%{opacity:.48;transform:scale(1)}}
@keyframes attackSmokeOut{0%{opacity:.48}100%{opacity:0}}
@keyframes slashHit{0%{opacity:0;transform:scale(.65) rotate(-8deg)}35%{opacity:1;transform:scale(1.08) rotate(0deg)}100%{opacity:0;transform:scale(1.15) rotate(3deg)}}
#game.attacking #attackSmoke{animation:attackSmokeIn .18s ease-out forwards}
#game.attackRecover #attackSmoke{animation:attackSmokeOut .25s ease-in forwards}
#attackSlash.hit{animation:slashHit .24s ease-out forwards}
</style>
</head>

const sprite=document.createElement('img');
sprite.id='attackSprite';
sprite.alt='';
sprite.draggable=false;
game.appendChild(sprite);
const smoke=document.createElement('img');
smoke.id='attackSmoke';
smoke.src=smokeSrc;
smoke.alt='';
game.appendChild(smoke);
const slash=document.createElement('img');
slash.id='attackSlash';
slash.src=slashSrc;
slash.alt='';
game.appendChild(slash);

let enemyHP=60;
let attacking=false;
let attackRun=0;

function setHP(hp){
  enemyHP=Math.max(0,hp);
  hpFill.style.transform=`scaleX(${enemyHP/60})`;
  hpText.textContent=`${enemyHP}/60`;
}

function showFrame(i,x,y,scale=1){
  sprite.src=frames[i];
  sprite.style.left=`${250 + x}px`;
  sprite.style.top=`${410 + y}px`;
  sprite.style.transform=`scale(${scale})`;
}

function hitEffect(){
  slash.style.left='1080px';
  slash.style.top='485px';
  slash.classList.remove('hit');
  void slash.offsetWidth;
  slash.style.display='block';
  slash.classList.add('hit');
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function attackAnimation(){
  const run=++attackRun;
  attacking=true;
  attackBtn.classList.add('locked');
  game.classList.remove('attackRecover');
  game.classList.add('attacking');
  sprite.style.display='block';
  smoke.style.display='block';
  hpFill.style.visibility='visible';
  hpText.style.visibility='visible';

  // 1-4: anticipation — the body settles before the dash.
  showFrame(0,0,0,1.00); await wait(105);
  showFrame(1,8,2,1.01); await wait(90);
  showFrame(2,28,4,1.02); await wait(80);
  showFrame(3,58,3,1.03); await wait(65);

  // 5-6: actual lunge. The displacement is progressive, not a teleport.
  showFrame(4,250,-2,1.04); await wait(80);
  showFrame(5,510,-5,1.02); await wait(95);

  // Impact at the end of the forward motion.
  if(run!==attackRun) return;
  setHP(enemyHP-15);
  hitEffect();
  await wait(85);

  // 7-8: deceleration and return to the exact starting pose.
  showFrame(6,250,0,1.01); await wait(95);
  showFrame(7,75,2,1.00); await wait(110);
  showFrame(0,0,0,1.00); await wait(75);

  sprite.style.display='none';
  game.classList.remove('attacking');
  game.classList.add('attackRecover');
  await wait(240);
  game.classList.remove('attackRecover');
  smoke.style.display='none';
  slash.style.display='none';
  attackBtn.classList.remove('locked');
  attacking=false;
}

attackBtn.addEventListener('click',()=>{
  if(attacking || enemyHP<=0) return;
  attackAnimation();
});
</script>
