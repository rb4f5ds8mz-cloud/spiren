<title>SPIREN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
body{display:grid;place-items:center}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#05070b}
#game{position:relative;width:min(100vw,calc(100dvh * 1672 / 940));height:min(100dvh,calc(100vw * 940 / 1672));aspect-ratio:1672/940;overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;z-index:5;touch-action:manipulation}
.hot:active{background:rgba(255,255,255,.06)}
#inventory{left:1%;top:25%;width:10%;height:12%}
#missions{left:1%;top:38%;width:10%;height:12%}
#stats{left:1%;top:51%;width:10%;height:12%}
#settings{left:1%;top:64%;width:10%;height:12%}
#attack{left:2%;bottom:2%;width:19%;height:16%}
#skill{left:22%;bottom:2%;width:19%;height:16%}
#item{left:42%;bottom:2%;width:19%;height:16%}
#flee{left:62%;bottom:2%;width:19%;height:16%}
#potion{right:1%;bottom:2%;width:8%;height:18%}
#portrait{display:none;position:fixed;inset:0;z-index:20;place-items:center;background:#05070b;color:#fff;font:700 18px system-ui;text-align:center}
@media (orientation:portrait){#portrait{display:grid}#game{display:none}}

#attacker{display:none}
#slash{display:none}
#impact{display:none}
#damage{display:none}
#enemyHpFill{position:absolute;left:72.1%;top:9.65%;width:17.25%;height:2.9%;z-index:4;pointer-events:none;background:#e92620;border-radius:5px;transform-origin:left center;}
#enemyHpText{position:absolute;left:80.7%;top:9.55%;z-index:5;pointer-events:none;color:#fff;font:900 20px Arial,sans-serif;text-shadow:2px 2px 0 #000;transform:translateX(-50%);}
#attack.locked{pointer-events:none;opacity:.7}
@keyframes sceneAttack{0%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:translateX(0)}}
#art.sceneAttack{animation:sceneAttack .72s ease-out forwards}
</style>

let enemyHP=60;
let attacking=false;
const attackBtn=document.getElementById('attack');
const hpFill=document.getElementById('enemyHpFill');
const hpText=document.getElementById('enemyHpText');

function setHP(hp){
  enemyHP=Math.max(0,hp);
  hpFill.style.transform=`scaleX(${enemyHP/60})`;
  hpText.textContent=`${enemyHP}/60`;
}

attackBtn.addEventListener('click',()=>{
  if(attacking || enemyHP<=0) return;
  attacking=true;
  attackBtn.classList.add('locked');

  // Durante el golpe se muestra una única escena de ataque, sin duplicar el sprite.
  art.src=attackArt;
  art.classList.add('sceneAttack');
  hpFill.style.visibility='hidden';
  hpText.style.visibility='hidden';

  setTimeout(()=>{
    setHP(enemyHP-15);
  },520);

  setTimeout(()=>{
    art.classList.remove('sceneAttack');
    art.src=baseArt;
    hpFill.style.visibility='visible';
    hpText.style.visibility='visible';
    attackBtn.classList.remove('locked');
    attacking=false;
  },850);
});
</script>
