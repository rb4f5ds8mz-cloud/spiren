<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SPIREN — Escenario</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,sans-serif}
#game{display:block;width:100vw;height:100vh;touch-action:none;background:#7fcf68}
#hint{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  padding:8px 14px;border-radius:20px;background:rgba(20,35,25,.55);
  color:white;font-size:12px;backdrop-filter:blur(5px);pointer-events:none;
  white-space:nowrap
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Arrastra para explorar el escenario</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {alpha:false});

const WORLD = { w: 3200, h: 2200 };
let view = {w: innerWidth, h: innerHeight, dpr: Math.min(devicePixelRatio || 1, 2)};
let camera = {x:0, y:0};
let dragging = false, lastX=0, lastY=0;
let seed = 73491;

function rnd(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){
  view.w=innerWidth; view.h=innerHeight; view.dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(view.w*view.dpr);
  canvas.height=Math.floor(view.h*view.dpr);
  canvas.style.width=view.w+"px"; canvas.style.height=view.h+"px";
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
}
addEventListener("resize",resize); resize();

function worldPoint(e){
  return {x:e.clientX+camera.x,y:e.clientY+camera.y};
}

function pan(dx,dy){
  camera.x=clamp(camera.x-dx,0,Math.max(0,WORLD.w-view.w));
  camera.y=clamp(camera.y-dy,0,Math.max(0,WORLD.h-view.h));
}

canvas.addEventListener("pointerdown",e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!dragging)return;
  pan(e.clientX-lastX,e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function drawGround(){
  ctx.fillStyle="#83d36d";
  ctx.fillRect(0,0,WORLD.w,WORLD.h);

  // Grandes manchas de pradera
  for(let i=0;i<180;i++){
    const x=rnd()*WORLD.w,y=rnd()*WORLD.h;
    const rx=30+rnd()*100, ry=18+rnd()*65;
    ctx.fillStyle=i%2?"rgba(255,255,255,.025)":"rgba(37,120,58,.035)";
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
  }

  // Motas de hierba
  for(let i=0;i<900;i++){
    const x=rnd()*WORLD.w,y=rnd()*WORLD.h;
    ctx.strokeStyle="rgba(39,110,48,.22)";
    ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(x,y+3); ctx.lineTo(x-2,y-2); ctx.moveTo(x,y+3); ctx.lineTo(x+2,y-2); ctx.stroke();
  }
}

function drawPath(){
  ctx.save();
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeStyle="#d8b47a";
  ctx.lineWidth=150;
  ctx.beginPath();
  ctx.moveTo(150,1880);
  ctx.bezierCurveTo(500,1760,650,1550,1000,1430);
  ctx.bezierCurveTo(1300,1320,1320,1110,1510,930);
  ctx.bezierCurveTo(1730,720,2020,690,2240,480);
  ctx.stroke();

  ctx.strokeStyle="#ebcc91";
  ctx.lineWidth=112;
  ctx.stroke();
  ctx.restore();
}

function drawLake(){
  const x=2150,y=300,w=720,h=520;
  ctx.save();
  ctx.shadowColor="rgba(23,70,100,.25)";ctx.shadowBlur=30;
  ctx.fillStyle="rgba(34,91,105,.18)";
  ctx.beginPath();ctx.ellipse(x+w/2+8,y+h/2+18,w/2+18,h/2+18,.08,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4daed0";
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0.08,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="rgba(160,235,240,.22)";
  for(let i=0;i<16;i++){
    const yy=y+80+i*27;
    ctx.beginPath();ctx.ellipse(x+130+(i%3)*110,yy,55,7,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function tree(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Sombra de contacto
  ctx.fillStyle="rgba(25,55,30,.22)";
  ctx.beginPath();ctx.ellipse(3,48,58,20,-.08,0,Math.PI*2);ctx.fill();

  // Raíces
  ctx.fillStyle="#68452f";
  ctx.beginPath();
  ctx.moveTo(-14,32);ctx.quadraticCurveTo(-37,43,-48,48);
  ctx.quadraticCurveTo(-28,50,-8,39);
  ctx.moveTo(11,32);ctx.quadraticCurveTo(33,44,48,46);
  ctx.quadraticCurveTo(29,49,7,39);ctx.fill();

  // Tronco principal
  const trunk=ctx.createLinearGradient(-18,0,20,0);
  trunk.addColorStop(0,"#67432e");
  trunk.addColorStop(.42,"#9a6841");
  trunk.addColorStop(.7,"#b47a4a");
  trunk.addColorStop(1,"#70472f");
  ctx.fillStyle=trunk;
  ctx.beginPath();
  ctx.moveTo(-17,35);ctx.quadraticCurveTo(-13,5,-20,-18);
  ctx.quadraticCurveTo(-7,-27,2,-19);
  ctx.quadraticCurveTo(10,3,17,35);
  ctx.closePath();ctx.fill();

  // Ramas
  ctx.strokeStyle="#74492f";ctx.lineWidth=9;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-3,3);ctx.lineTo(-29,-25);ctx.lineTo(-45,-34);
  ctx.moveTo(5,1);ctx.lineTo(27,-27);ctx.lineTo(43,-37);ctx.stroke();

  // Corteza
  ctx.strokeStyle="rgba(63,38,27,.38)";ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.moveTo(-9,-9);ctx.lineTo(-6,26);
  ctx.moveTo(5,-7);ctx.lineTo(10,27);
  ctx.moveTo(-1,-2);ctx.lineTo(3,17);
  ctx.stroke();

  // Copa trasera
  ctx.fillStyle="#277b48";
  ctx.beginPath();
  ctx.arc(-31,-30,31,0,Math.PI*2);
  ctx.arc(0,-49,43,0,Math.PI*2);
  ctx.arc(34,-29,34,0,Math.PI*2);
  ctx.fill();

  // Copa media
  ctx.fillStyle="#3f9d55";
  ctx.beginPath();
  ctx.arc(-27,-45,27,0,Math.PI*2);
  ctx.arc(2,-65,35,0,Math.PI*2);
  ctx.arc(30,-48,28,0,Math.PI*2);
  ctx.arc(0,-29,35,0,Math.PI*2);
  ctx.fill();

  // Hojas iluminadas
  ctx.fillStyle="#72c76a";
  ctx.beginPath();
  ctx.arc(-18,-64,15,0,Math.PI*2);
  ctx.arc(7,-76,18,0,Math.PI*2);
  ctx.arc(28,-55,13,0,Math.PI*2);
  ctx.arc(-4,-42,14,0,Math.PI*2);
  ctx.fill();

  // Detalles de hoja
  ctx.fillStyle="rgba(255,255,210,.20)";
  for(let i=0;i<7;i++){
    const a=i*1.7;
    ctx.beginPath();ctx.arc(Math.cos(a)*25, -48+Math.sin(a)*24, 3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function bush(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle="rgba(30,80,35,.15)";
  ctx.beginPath();ctx.ellipse(0,12,35,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4aa957";
  ctx.beginPath();ctx.arc(-20,0,19,0,Math.PI*2);ctx.arc(0,-7,24,0,Math.PI*2);ctx.arc(22,0,20,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function rock(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  ctx.fillStyle="rgba(30,45,35,.20)";
  ctx.beginPath();ctx.ellipse(3,15,34,13,-.08,0,Math.PI*2);ctx.fill();

  // Base de roca
  const stone=ctx.createLinearGradient(-28,-22,25,22);
  stone.addColorStop(0,"#b7c0bd");
  stone.addColorStop(.45,"#8f9b9a");
  stone.addColorStop(1,"#667273");
  ctx.fillStyle=stone;
  ctx.beginPath();
  ctx.moveTo(-31,8);
  ctx.quadraticCurveTo(-28,-13,-13,-22);
  ctx.quadraticCurveTo(7,-31,24,-17);
  ctx.quadraticCurveTo(35,-4,28,12);
  ctx.quadraticCurveTo(10,25,-12,22);
  ctx.quadraticCurveTo(-29,20,-31,8);
  ctx.closePath();ctx.fill();

  // Cara iluminada
  ctx.fillStyle="#cbd1ce";
  ctx.beginPath();
  ctx.moveTo(-18,-14);ctx.lineTo(-4,-23);ctx.lineTo(10,-17);
  ctx.lineTo(1,-5);ctx.lineTo(-18,-4);ctx.closePath();ctx.fill();

  // Grietas
  ctx.strokeStyle="rgba(57,67,67,.48)";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-3,-17);ctx.lineTo(-7,-7);ctx.lineTo(-1,1);
  ctx.moveTo(13,-11);ctx.lineTo(9,-2);ctx.lineTo(14,7);
  ctx.moveTo(-19,4);ctx.lineTo(-9,8);
  ctx.stroke();

  // Musgo
  ctx.strokeStyle="rgba(69,128,76,.55)";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-25,10);ctx.quadraticCurveTo(-15,4,-5,8);ctx.stroke();

  ctx.restore();
}

function house(x,y,s=1,roof="#b75b4d"){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Sombra
  ctx.fillStyle="rgba(38,52,38,.20)";
  ctx.beginPath();ctx.ellipse(0,61,105,27,0,0,Math.PI*2);ctx.fill();

  // Cuerpo
  const wall=ctx.createLinearGradient(-75,-15,75,65);
  wall.addColorStop(0,"#f6dfb2");
  wall.addColorStop(.55,"#e7c78f");
  wall.addColorStop(1,"#c99d6b");
  ctx.fillStyle=wall;
  roundedRect(-78,-15,156,82,12);ctx.fill();

  // Piedras de zócalo
  ctx.fillStyle="rgba(125,94,64,.22)";
  for(let i=0;i<7;i++){
    roundedRect(-68+i*21,50,17,9,3);ctx.fill();
  }

  // Tejado base
  ctx.fillStyle="#763e39";
  ctx.beginPath();ctx.moveTo(-96,-12);ctx.lineTo(0,-84);ctx.lineTo(96,-12);ctx.lineTo(87,3);ctx.lineTo(0,-61);ctx.lineTo(-87,3);ctx.closePath();ctx.fill();

  // Tejas
  ctx.fillStyle=roof;
  ctx.beginPath();ctx.moveTo(-89,-11);ctx.lineTo(0,-77);ctx.lineTo(89,-11);ctx.lineTo(82,0);ctx.lineTo(0,-63);ctx.lineTo(-82,0);ctx.closePath();ctx.fill();

  ctx.strokeStyle="rgba(104,51,45,.55)";ctx.lineWidth=4;
  for(let i=-4;i<=4;i++){
    ctx.beginPath();
    ctx.moveTo(i*17,-17-Math.abs(i)*8);
    ctx.lineTo(i*17,-12-Math.abs(i)*8);
    ctx.stroke();
  }

  // Chimenea
  ctx.fillStyle="#a75e4d";
  roundedRect(35,-66,17,38,4);ctx.fill();
  ctx.fillStyle="#81443b";roundedRect(32,-69,23,6,3);ctx.fill();

  // Puerta
  const door=ctx.createLinearGradient(-16,18,16,64);
  door.addColorStop(0,"#81523a");door.addColorStop(1,"#593a2b");
  ctx.fillStyle=door;roundedRect(-17,19,34,48,6);ctx.fill();
  ctx.fillStyle="#d8b35d";ctx.beginPath();ctx.arc(8,44,3,0,Math.PI*2);ctx.fill();

  // Ventanas
  function windowBox(wx){
    ctx.fillStyle="#68463a";roundedRect(wx,2,32,30,6);ctx.fill();
    ctx.fillStyle="#a9dce3";roundedRect(wx+4,6,24,22,4);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(wx+16,6);ctx.lineTo(wx+16,28);ctx.moveTo(wx+4,17);ctx.lineTo(wx+28,17);ctx.stroke();
  }
  windowBox(-61);windowBox(29);

  // Farol
  ctx.fillStyle="#60412f";ctx.fillRect(75,5,4,45);
  ctx.fillStyle="#f7df8c";ctx.beginPath();ctx.arc(77,5,7,0,Math.PI*2);ctx.fill();

  // Flores junto a la entrada
  ctx.fillStyle="#ef9bb5";
  ctx.beginPath();ctx.arc(-31,65,4,0,Math.PI*2);ctx.arc(-41,61,3,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function flowers(){
  const old=seed;
  for(let i=0;i<180;i++){
    const x=120+rnd()*1500,y=1050+rnd()*950;
    if(x>650&&x<1350&&y>1200&&y<1750) continue;
    const colors=["#fff5c7","#f7a8bd","#c9b2f2"];
    ctx.fillStyle=colors[i%3];
    ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.arc(x+4,y+2,2.6,0,Math.PI*2);ctx.arc(x-4,y+2,2.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#e7b84e";ctx.beginPath();ctx.arc(x,y+1,1.8,0,Math.PI*2);ctx.fill();
  }
  seed=old;
}

function forest(){
  // cinturón forestal superior izquierdo
  for(let i=0;i<55;i++){
    const x=120+rnd()*1450,y=120+rnd()*600;
    tree(x,y,.75+rnd()*.45);
  }
  // borde del lago
  for(let i=0;i<28;i++){
    const a=rnd()*Math.PI*2;
    const x=2510+Math.cos(a)*(365+rnd()*45);
    const y=560+Math.sin(a)*(265+rnd()*45);
    tree(x,y,.55+rnd()*.35);
  }
}

function village(){
  // plaza
  ctx.fillStyle="#d8bd88";
  ctx.beginPath();ctx.ellipse(930,1480,430,280,0,0,Math.PI*2);ctx.fill();

  house(760,1390,1.08,"#c46655");
  house(1110,1395,.96,"#a95362");
  house(720,1640,.92,"#d18a4d");
  house(1110,1660,1.05,"#bb6650");

  // pozo decorativo
  ctx.fillStyle="#81766a";
  ctx.beginPath();ctx.arc(930,1510,48,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#5b9aa7";ctx.beginPath();ctx.arc(930,1510,31,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#6e4d38";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(890,1455);ctx.lineTo(970,1455);ctx.stroke();
}

function decorations(){
  for(let i=0;i<70;i++){
    const x=100+rnd()*3000,y=900+rnd()*1150;
    if(x>600&&x<1300&&y>1250&&y<1750) continue;
    if(x>1950&&y<900) continue;
    if(rnd()<.7) bush(x,y,.45+rnd()*.55); else rock(x,y,.45+rnd()*.5);
  }
}

function drawWorld(){
  ctx.clearRect(0,0,view.w,view.h);
  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  drawGround();
  drawPath();
  drawLake();
  village();

  // reiniciamos una semilla estable para que decoración sea consistente
  seed=123456;
  forest();
  seed=987654;
  decorations();
  seed=456789;
  flowers();

  ctx.restore();

  // viñeta muy ligera
  const g=ctx.createRadialGradient(view.w/2,view.h/2,Math.min(view.w,view.h)*.2,view.w/2,view.h/2,Math.max(view.w,view.h)*.75);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(0,0,0,.10)");
  ctx.fillStyle=g;ctx.fillRect(0,0,view.w,view.h);
}

function frame(){
  drawWorld();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
